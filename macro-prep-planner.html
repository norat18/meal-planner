<style>
/* Layout: a working week board. Nutrition-label header strip on top, tabbed tool below, one day card per row. */
:root {
  --bg: #F3F6F2;
  --surface: #FFFFFF;
  --ink: #17211B;
  --muted: #5B6A61;
  --line: #D8E0DA;
  --accent: #2C6A4C;
  --accent-ink: #FFFFFF;
  --soft: #E3EEE7;
  --protein: #8A4A9B;
  --carb: #B97D12;
  --fat: #2A7499;
  --ok: #2E8549;
  --warn: #BF5130;
  --band: rgba(44,106,76,.13);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1511; --surface: #172019; --ink: #E5EDE7; --muted: #98A79E; --line: #2A362E;
    --accent: #72C196; --accent-ink: #0B170F; --soft: #1E2C23;
    --protein: #CB92DA; --carb: #E4B14C; --fat: #6DB9DC; --ok: #6ECF8D; --warn: #F08C66;
    --band: rgba(114,193,150,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1511; --surface: #172019; --ink: #E5EDE7; --muted: #98A79E; --line: #2A362E;
  --accent: #72C196; --accent-ink: #0B170F; --soft: #1E2C23;
  --protein: #CB92DA; --carb: #E4B14C; --fat: #6DB9DC; --ok: #6ECF8D; --warn: #F08C66;
  --band: rgba(114,193,150,.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); }
.facts {
  border: 2px solid var(--ink); background: var(--surface); padding: 6px 12px 8px;
  display: grid; grid-template-columns: repeat(4, auto); column-gap: 18px; min-width: 0;
}
.facts .ft { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 800; font-size: 15px; border-bottom: 6px solid var(--ink); padding-bottom: 2px; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }
.facts .ft button { font: 600 12px var(--font-body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.facts div.f { display: grid; }
.facts .v { font-family: var(--font-data); font-size: 17px; font-weight: 500; }
.facts .k { font-size: 11px; color: var(--muted); }
.k i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button {
  background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted);
  font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-left: 4px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.btn.ghost:hover { color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }

.statusline { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok::before { background: var(--ok); }

/* Toolbar */
.toolbar { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {

/* Day cards */

.day-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.day-head h3 { font-size: 19px; font-weight: 700; min-width: 108px; }
.day-head select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-size: 13px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; background: var(--bg); }
.slot.locked { border-color: var(--accent); }
.slot-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.lock { background: none; border: 0; cursor: pointer; padding: 2px 4px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 4px; }
.lock[aria-pressed="true"] { color: var(--accent); }
.slot select { width: 100%; min-width: 0; border: 0; background: transparent; font-weight: 600; font-size: 14px; padding: 2px 0; cursor: pointer; text-overflow: ellipsis; }
.slot-meta { font-size: 12px; color: var(--muted); font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.slot-meta b { color: var(--ink); font-weight: 500; }

.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.meter { display: grid; gap: 4px; min-width: 0; }
.meter-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.meter-top .num { font-size: 12px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar .band { position: absolute; top: 0; bottom: 0; background: var(--band); }
.bar .fill { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 2px; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.meter.off .meter-top .num { color: var(--warn); }
@media (max-width: 640px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.panel h2 { font-size: 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Groceries */
.cat { display: grid; gap: 2px; }
.cat h3 { font-size: 14px; font-family: var(--font-body); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.gitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.gitem input { margin: 0; transform: translateY(2px); accent-color: var(--accent); }
.gitem .name { font-weight: 600; text-transform: capitalize; }
.gitem .used { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.gitem .amt { font-family: var(--font-data); font-size: 13px; text-align: right; }
.gitem.done .name, .gitem.done .amt { text-decoration: line-through; color: var(--muted); }
.prep li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.prep ul { list-style: none; margin: 0; padding: 0; }
.bigstat { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; }

/* Recipes */
.rlist { display: grid; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) 128px; gap: 6px 18px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rhead { padding: 2px 0 6px; border-bottom: 2px solid var(--ink); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.msum { display: grid; gap: 2px; justify-items: end; text-align: right; min-width: 0; }
.msum .kcal { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.msum .mline { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.msum .mline .sep { color: var(--muted); margin: 0 6px; }
.msum .lbl { color: var(--muted); font-weight: 600; }
.msum .hl { background: var(--soft); color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.msum .hl .lbl { color: var(--accent); }
.split { display: flex; height: 5px; width: min(160px, 100%); border-radius: 3px; overflow: hidden; margin-top: 5px; background: var(--soft); }
.split span { display: block; height: 100%; }
.ractions { display: flex; gap: 6px; justify-content: flex-end; }
.sheet .msum { justify-items: start; text-align: left; padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.sheet .msum .kcal { font-size: 24px; }
.sheet .msum .mline { font-size: 16px; white-space: normal; }
.sheet .msum .per { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) {
  .rrow { grid-template-columns: minmax(0, 1fr) auto; }
  .rrow .ractions { grid-column: 2; grid-row: 1; }
  .rrow .msum { grid-column: 1 / -1; grid-row: 2; justify-items: start; text-align: left; }
  .msum .mline { white-space: normal; }
}
.rrow .nm { font-weight: 600; }
.rrow .sub { font-size: 12px; color: var(--muted); }
.macros { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.macros span i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); margin-left: 6px; }

.form { display: grid; gap: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, textarea.code {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0;
}
textarea.code { font-family: var(--font-data); font-size: 12.5px; min-height: 180px; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink); font-weight: 500; }
.hint { font-size: 13px; color: var(--muted); max-width: 68ch; }
pre.sample { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12px/1.5 var(--font-data); margin: 0; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--accent); color: var(--accent); }
.slot-actions { display: flex; gap: 2px; }

/* Recipe sheet */
.sheet-back {
  position: fixed; inset: 0; background: rgba(10,16,12,.45); z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 680px; max-height: 100%;
  overflow-y: auto; padding: 20px 22px 24px; display: grid; gap: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.sheet-head { display: flex; gap: 12px; align-items: flex-start; }
.sheet-head h2 { font-size: clamp(22px, 3.4vw, 28px); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; flex: 1; }
.sheet-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: var(--font-body); font-weight: 400; letter-spacing: 0; }

.mfacts div { padding: 8px 0; display: grid; }
.mfacts div + div { border-left: 1px solid var(--line); padding-left: 12px; }
.mfacts .v { font-family: var(--font-data); font-size: 18px; font-weight: 500; }
.mfacts .k { font-size: 11px; color: var(--muted); }
.sheet h3 { font-size: 13px; font-family: var(--font-body); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.ilist { list-style: none; margin: 0; padding: 0; }
.ilist li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ilist .q { font-family: var(--font-data); font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
.dlg-back {
  position: fixed; inset: 0; z-index: 30; background: rgba(10,16,12,.5);
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dlg { background: var(--surface); color: var(--ink); border-radius: 12px; border-top: 4px solid var(--warn); width: 100%; max-width: 420px; padding: 20px 22px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dlg h2 { font-size: 19px; line-height: 1.25; }
.dlg p { margin: 0; color: var(--muted); }
.dlg p b { color: var(--ink); }
.dlg-actions { justify-content: flex-end; }

.barcode { background: #FFFFFF; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; justify-items: center; gap: 2px; max-width: 100%; }
.barcode svg { display: block; max-width: 100%; height: auto; }
.barcode span { font-size: 11px; color: #4A554E; }
.quick { display: grid; gap: 8px; min-width: 0; flex: 1 1 220px; }

@media (max-width: 560px) {

  .sheet { border-radius: 14px 14px 0 0; max-height: 92%; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .mfacts .v { font-size: 15px; }
}

.toast {

<script>
/* ---------- constants ---------- */
const SLOTS = [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snack"]];

const STAPLE = "Pantry staples";
const STAPLE_WEIGHT = 0.2;
const MACROS = [["cal","Calories","kcal","--accent"],["p","Protein","g","--protein"],["c","Carbs","g","--carb"],["f","Fat","g","--fat"]];

const DEFAULT_SETTINGS = {
  targets: { cal: 2000, p: 150, c: 200, f: 67 },
  tol: { cal: 5, p: 10, c: 15, f: 15 },
  slots: { breakfast: true, lunch: true, dinner: true, snack: true },
  maxRepeat: 3, portionMin: 0.5, portionMax: 2, cuisines: [], seeded: false
};

/* Example recipes. Macros are per serving; ingredient amounts are for the whole recipe. */
const EXAMPLES = [
 ["Greek Yogurt Berry Bowl","Mediterranean","breakfast",1,380,30,45,9,["250 g greek yogurt","100 g mixed berries","30 g rolled oats","10 g honey","10 g chia seeds"]],
 ["Spinach Feta Scramble","Mediterranean","breakfast",1,420,30,22,24,["3 eggs","60 g spinach","30 g feta","1 slice whole wheat bread","1 tsp olive oil"]],
 ["Huevos Rancheros","Mexican","breakfast",2,480,26,48,20,["4 eggs","4 corn tortillas","240 g black beans","120 g salsa","1 avocado","40 g cheddar"]],

/* ---------- recipe normalization & import ---------- */
function normMeals(v) {
  const arr = Array.isArray(v) ? v : String(v || "").split(/[,;\/|]+/);
  const out = new Set();
  for (let m of arr) {
    m = String(m).trim().toLowerCase();
    if (/break|brunch|morning/.test(m)) out.add("breakfast");
    else if (/lunch/.test(m)) out.add("lunch");
    else if (/dinner|supper|main|entree/.test(m)) out.add("dinner");
    else if (/snack|dessert/.test(m)) out.add("snack");
  }
  return out.size ? [...out] : ["lunch","dinner"];
}
function pick(o, keys) { for (const k of keys) { if (o[k] !== undefined && o[k] !== "") return o[k]; } return undefined; }
function normalizeRecipe(raw, opts = {}) {
  const name = String(pick(raw, ["name","title","recipe"]) || "").trim();
  if (!name) throw new Error("missing a name");
  const servings = parseFloat(pick(raw, ["servings","serves","yield","portions"])) || 1;
  const n = k => parseFloat(pick(raw, k));
  const mac = raw.macros || raw.nutrition || {};
  let cal = n(["calories","kcal","cal","energy"]), p = n(["protein","p"]), c = n(["carbs","carbohydrates","carb","c"]), f = n(["fat","fats","f"]);
  if (isNaN(cal)) cal = parseFloat(pick(mac, ["calories","kcal","cal"]));
  if (isNaN(p)) p = parseFloat(pick(mac, ["protein","p"]));
  if (isNaN(c)) c = parseFloat(pick(mac, ["carbs","carbohydrates","c"]));
  if (isNaN(f)) f = parseFloat(pick(mac, ["fat","f"]));
  if ([p,c,f].some(isNaN)) throw new Error("missing protein, carbs or fat");
  if (isNaN(cal)) cal = p*4 + c*4 + f*9;
  if (opts.totals) { cal /= servings; p /= servings; c /= servings; f /= servings; }
  let ings = raw.ingredients || [];
  if (typeof ings === "string") ings = ings.split(/\n+/);
  ings = ings.map(i => {
    if (typeof i === "string") return parseIngredientLine(i);
    const item = String(pick(i, ["item","name","ingredient","food"]) || "").trim().toLowerCase();
    if (!item) return null;
    const q = pick(i, ["qty","quantity","amount"]);
    const parsed = typeof q === "string" ? parseIngredientLine(q + " " + (i.unit ? i.unit + " " : "") + item) : null;
    if (parsed && parsed.qty != null) { if (i.category) parsed.category = i.category; return parsed; }
    return { item, qty: q == null || q === "" ? null : parseFloat(q), unit: String(i.unit || "").toLowerCase(), category: i.category || guessCategory(item) };
  }).filter(Boolean);
  let steps = pick(raw, ["steps","instructions","directions","method"]) || [];
  if (typeof steps === "string") steps = steps.split(/\n+/);
  steps = steps.map(s => String(s).replace(/^\s*(\d+[.)]|step\s*\d+[:.]?|[-•*])\s*/i, "").trim()).filter(Boolean);
  return {
    id: raw.id || uid(name), name,
    cuisine: String(pick(raw, ["cuisine","category","style"]) || "Other").trim().replace(/^\w/, ch => ch.toUpperCase()),
    meals: normMeals(pick(raw, ["meals","meal","mealType","meal_type","type","course"])),
    servings, cal: Math.round(cal), p: +p.toFixed(1), c: +c.toFixed(1), f: +f.toFixed(1),
    ingredients: ings, steps, example: !!raw.example,
    ...(raw.source ? { source: String(raw.source) } : {})
  };
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function parseImport(text, opts) {
  text = text.trim();
  const ok = [], bad = [];
  let raws = [];
  if (/^[\[{]/.test(text)) {
    let data = JSON.parse(text);
    if (!Array.isArray(data)) data = data.recipes || [data];
    raws = data;
  } else {
    const rows = parseCSV(text);
    const head = rows.shift().map(h => h.trim().toLowerCase());
    const col = name => head.indexOf(name);
    const by = new Map();
    for (const r of rows) {
      const o = {}; head.forEach((h, i) => { o[h] = (r[i] || "").trim(); });
      const key = o.name || o.title || o.recipe;
      if (!key) continue;
      if (!by.has(key)) by.set(key, { ...o, ingredients: [] });
      const rec = by.get(key);
      for (const h of head) if (!rec[h] && o[h]) rec[h] = o[h];
      const ing = o.ingredient || o.item;
      if (ing) rec.ingredients.push(o.qty || o.quantity || o.amount ? { item: ing, qty: o.qty || o.quantity || o.amount, unit: o.unit, category: o.category && col("ingredient") >= 0 ? o.category : undefined } : ing);
    }
    raws = [...by.values()];
  }
  raws.forEach((r, i) => {
    try { ok.push(normalizeRecipe(r, opts)); }
    catch (e) { bad.push(`${r && (r.name || r.title) || "Recipe " + (i+1)}: ${e.message}`); }
  });

}
function exampleRecipes() {

}

/* ---------- derived data ---------- */
function activeSlots() { return SLOTS.map(s => s[0]).filter(s => state.settings.slots[s]); }
function cuisines() { return [...new Set(Object.values(state.recipes).map(r => r.cuisine))].sort(); }
function itemKey(name) { return name.toLowerCase().replace(/\s+/g, " ").trim(); }
function recipeItems(r) {
  if (!r._items) r._items = [...new Map(r.ingredients.map(i => [itemKey(i.item), i.category === STAPLE ? STAPLE_WEIGHT : 1])).entries()];
  return r._items;

function eligibleIds(slot, dayCuisine) {
  const all = Object.values(state.recipes).filter(r => r.meals.includes(slot));
  const g = state.settings.cuisines;
  let base = g.length ? all.filter(r => g.includes(r.cuisine)) : all;
  if (!base.length) base = all;
  if (dayCuisine) { const dc = all.filter(r => r.cuisine === dayCuisine); if (dc.length) base = dc; }

function portionSteps() {
  const s = state.settings, out = [];
  for (let v = s.portionMin; v <= s.portionMax + 1e-9; v += 0.25) out.push(+v.toFixed(2));

/* ---------- portion solver ---------- */
// Picks a serving multiplier per meal so the day lands inside every macro tolerance band.
function solve(recs) {
  const S = state.settings;
  const T = [S.targets.cal, S.targets.p, S.targets.c, S.targets.f];
  const TL = [S.tol.cal, S.tol.p, S.tol.c, S.tol.f].map(v => Math.max(v, 1) / 100);
  const W = [1.5, 1.2, 1, 1];
  const M = recs.map(r => [r.cal, r.p, r.c, r.f]);
  const P = portionSteps(), n = recs.length;
  const sumCal = M.reduce((a, m) => a + m[0], 0) || 1;
  const nearest = v => P.reduce((b, p) => Math.abs(p - v) < Math.abs(b - v) ? p : b, P[0]);
  const x = Array(n).fill(nearest(T[0] / sumCal));
  const tot = [0, 0, 0, 0];
  for (let i = 0; i < n; i++) for (let k = 0; k < 4; k++) tot[k] += x[i] * M[i][k];
  const err = () => {
    let e = 0;
    for (let k = 0; k < 4; k++) { if (T[k] > 0) { const d = (tot[k] - T[k]) / (T[k] * TL[k]); e += W[k] * d * d; } }
    for (let i = 0; i < n; i++) e += 0.04 * (x[i] - 1) * (x[i] - 1);
    return e;
  };
  let best = err();
  for (let pass = 0; pass < 6; pass++) {
    let changed = false;
    for (let i = 0; i < n; i++) {
      const cur = x[i]; let bv = cur;
      for (const v of P) {
        if (v === cur) continue;
        for (let k = 0; k < 4; k++) tot[k] += (v - x[i]) * M[i][k];
        x[i] = v;
        const e = err();
        if (e < best - 1e-9) { best = e; bv = v; }
      }
      for (let k = 0; k < 4; k++) tot[k] += (bv - x[i]) * M[i][k];
      x[i] = bv;
      if (bv !== cur) changed = true;
    }
    if (!changed) break;
  }
  const dev = tot.map((t, k) => T[k] > 0 ? (t - T[k]) / (T[k] * TL[k]) : 0);
  return { x: x.slice(), err: best, tot, dev, feasible: dev.every(d => Math.abs(d) <= 1) };
}

/* ---------- day pools ---------- */
const COMBO_CAP = 120000;
function dayPool(d) {
  const day = state.plan.days[d], act = activeSlots();
  const lists = act.map(s => {
    const c = day.slots[s];
    if (c && c.locked && state.recipes[c.id]) return [c.id];
    return eligibleIds(s, day.cuisine);
  });
  const key = JSON.stringify(lists);
  if (poolCache.has(key)) return poolCache.get(key);
  const result = { combos: [], feasible: false, missing: act.filter((s, i) => !lists[i].length) };
  if (result.missing.length || !act.length) { poolCache.set(key, result); return result; }
  const feas = [], other = [];
  const visit = ids => {
    if (new Set(ids).size < ids.length) return;
    const s = solve(ids.map(id => state.recipes[id]));
    const c = { ids, x: s.x, err: s.err };
    if (s.feasible) feas.push(c);
    else { other.push(c); if (other.length > 400) { other.sort((a, b) => a.err - b.err); other.length = 80; } }
  };
  const total = lists.reduce((a, l) => a * l.length, 1);
  if (total <= COMBO_CAP) {
    const rec = (i, acc) => { if (i === lists.length) return visit(acc.slice()); for (const id of lists[i]) { acc.push(id); rec(i + 1, acc); acc.pop(); } };
    rec(0, []);
  } else {
    for (let t = 0; t < COMBO_CAP; t++) visit(lists.map(l => l[Math.floor(Math.random() * l.length)]));
  }
  feas.sort((a, b) => a.err - b.err);
  other.sort((a, b) => a.err - b.err);
  result.feasible = feas.length > 0;
  result.combos = feas.length ? feas : other.slice(0, 60);
  poolCache.set(key, result);
  return result;
}
function currentCombo(d) {
  const day = state.plan.days[d], act = activeSlots();
  const ids = act.map(s => day.slots[s] && state.recipes[day.slots[s].id] ? day.slots[s].id : null);
  if (ids.some(id => !id)) return null;
  const s = solve(ids.map(id => state.recipes[id]));
  return { ids, x: act.map(sl => day.slots[sl].x || 1), err: s.err };
}

/* ---------- week generator ---------- */
function weekScore(choices) {
  const items = new Map(), rep = new Map(); let err = 0;
  for (const c of choices) {
    if (!c) continue;
    err += c.err;
    for (const id of new Set(c.ids)) {
      rep.set(id, (rep.get(id) || 0) + 1);
      for (const [k, w] of recipeItems(state.recipes[id])) items.set(k, w);
    }
  }
  let g = 0; for (const w of items.values()) g += w;
  let pen = 0; const max = state.settings.maxRepeat;
  for (const v of rep.values()) if (v > max) pen += (v - max) * 40;
  return g + 0.6 * err + pen;
}
function generate(mode, days) {

    else if (!pools[d].feasible) offTarget.push(d);
  }
  const free = days.filter(d => pools[d].combos.length);
  let choices = state.plan.days.map((_, d) => days.includes(d) ? null : currentCombo(d));
  const top = p => p.combos[Math.floor(Math.random() * Math.min(p.combos.length, 400))];
  if (mode === "random") {
    const counts = new Map();
    choices.forEach(c => c && new Set(c.ids).forEach(id => counts.set(id, (counts.get(id) || 0) + 1)));

      const p = pools[d].combos; let pickC = null;

        const c = p[Math.floor(Math.random() * p.length)];
        if ([...new Set(c.ids)].every(id => (counts.get(id) || 0) < state.settings.maxRepeat)) pickC = c;
      }
      pickC = pickC || p[0];
      new Set(pickC.ids).forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
      choices[d] = pickC;
    }
  } else if (free.length) {

  if (filled.length < act.length) return;
  const s = solve(filled.map(sl => state.recipes[day.slots[sl].id]));

}
function dayStatus(d) {

/* ---------- groceries ---------- */
function groceries() {
  const items = new Map(), cook = new Map();
  state.plan.days.forEach((day, d) => {
    for (const s of activeSlots()) {
      const c = day.slots[s], r = c && state.recipes[c.id];
      if (!r) continue;
      const x = c.x || 1;
      const ck = cook.get(r.id) || { r, portions: 0, days: new Set() };
      ck.portions += x; ck.days.add(DAYS[d].slice(0, 3)); cook.set(r.id, ck);
      const f = x / (r.servings || 1);
      for (const ing of r.ingredients) {
        const k = itemKey(ing.item);
        const g = items.get(k) || { key: k, name: ing.item, category: ing.category || "Other", amounts: {}, used: new Set(), untracked: false };
        g.used.add(r.name);
        if (ing.qty == null || isNaN(ing.qty)) g.untracked = true;
        else {
          const u = UNITS[ing.unit] || [ing.unit || "", 1];
          g.amounts[u[0]] = (g.amounts[u[0]] || 0) + ing.qty * u[1] * f;
        }

      }

}
function fmtNum(v) {
  if (v >= 10) return String(Math.round(v));
  const q = round(v, 0.25);
  const whole = Math.floor(q), fr = q - whole;
  const f = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[+fr.toFixed(2)] || "";
  if (!whole && !f) return "¼";
  return (whole || "") + f;
}
function fmtAmount(unit, v) {
  if (unit === "g") return v >= 1000 ? (+(v / 1000).toFixed(2)) + " kg" : (v >= 20 ? round(v, 5) : Math.round(v)) + " g";
  if (unit === "ml") return v >= 1000 ? (+(v / 1000).toFixed(2)) + " L" : (v >= 20 ? round(v, 5) : Math.round(v)) + " ml";
  if (unit === "oz") return v >= 16 ? (+(v / 16).toFixed(2)) + " lb" : fmtNum(v) + " oz";
  if (unit === "tbsp") return v < 1 ? fmtNum(v * 3) + " tsp" : fmtNum(v) + " tbsp";
  if (!unit) return fmtNum(Math.ceil(v * 4) / 4);
  return fmtNum(v) + " " + unit + (v > 1 && !/s$/.test(unit) && unit !== "pinch" ? "s" : "");
}
function amountText(g) {
  const parts = Object.entries(g.amounts).map(([u, v]) => fmtAmount(u, v));
  if (g.untracked && !parts.length) return "to taste";
  return parts.join(" + ");
}

/* ---------- persistence ---------- */
let planTimer = null, settingsTimer = null, lastPlanJSON = "", lastSettingsJSON = "";
function persistLocal() {
  lsSet("mpp.recipes", Object.values(state.recipes).map(stripRecipe));
  lsSet("mpp.settings", state.settings);
  lsSet("mpp.plan", state.plan);
}
function stripRecipe(r) { const { _items, ...rest } = r; return rest; }
function savePlan() {
  clearTimeout(planTimer);
  planTimer = setTimeout(async () => {
    planTimer = null;
    if (state.mode === "local") return persistLocal();
    if (state.mode !== "db" || state.readOnly) return;
    lastPlanJSON = JSON.stringify(state.plan);
    try { await db.doc("app/plan").set(clone(state.plan)); } catch (e) { writeFailed(e); }
  }, 500);
}
function saveSettings() {
  poolCache.clear();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async () => {
    settingsTimer = null;
    if (state.mode === "local") return persistLocal();
    if (state.mode !== "db" || state.readOnly) return;
    lastSettingsJSON = JSON.stringify(state.settings);
    try { await db.doc("app/settings").set(clone(state.settings)); } catch (e) { writeFailed(e); }
  }, 600);
}
async function saveRecipes(list) {
  poolCache.clear();
  for (const r of list) { delete r._items; state.recipes[r.id] = r; }
  if (state.mode === "local") return persistLocal();
  if (state.mode !== "db" || state.readOnly) return;
  try {
    for (let i = 0; i < list.length; i += 8) await Promise.all(list.slice(i, i + 8).map(r => db.collection("recipes").doc(r.id).set(stripRecipe(r))));
  } catch (e) { writeFailed(e); }
}
async function deleteRecipes(ids) {
  poolCache.clear();
  ids.forEach(id => delete state.recipes[id]);
  if (state.mode === "local") return persistLocal();
  if (state.mode !== "db" || state.readOnly) return;
  try { for (const id of ids) await db.collection("recipes").doc(id).delete(); } catch (e) { writeFailed(e); }
}
function writeFailed(e) {
  if (e && e.code === "invalid_argument") { state.readOnly = true; toast("You can view this planner but not change it."); render(); }
  else if (e && e.code === "quota_exceeded") toast("Storage is full. Delete some recipes and try again.");
  else toast("Couldn't save just now. Your last change may not be kept.");
}
function mergeSettings(s) {
  const d = clone(DEFAULT_SETTINGS);
  return { ...d, ...s, targets: { ...d.targets, ...(s && s.targets) }, tol: { ...d.tol, ...(s && s.tol) }, slots: { ...d.slots, ...(s && s.slots) }, cuisines: (s && s.cuisines) || [] };
}
function mergePlan(p) {
  const e = emptyPlan();
  if (!p || !Array.isArray(p.days)) return e;
  return { days: e.days.map((d, i) => ({ cuisine: (p.days[i] && p.days[i].cuisine) || "", slots: (p.days[i] && p.days[i].slots) || {} })), checked: p.checked || {} };
}
function firstRun() {
  const ex = exampleRecipes();
  ex.forEach(r => state.recipes[r.id] = r);
  state.settings.seeded = true;
  generate("lean", DAYS.map((_, i) => i));
  return ex;
}

async function boot() {
  const claude = window.claude;
  if (claude && claude.use) {
    try { db = await claude.use("db"); } catch { db = null; }
  }
  if (db) {
    state.mode = "db";
    try {
      const [sSnap, rSnap, pSnap] = await Promise.all([db.doc("app/settings").get(), db.collection("recipes").get(), db.doc("app/plan").get()]);
      state.settings = mergeSettings(sSnap.exists ? sSnap.data() : null);
      rSnap.docs.forEach(doc => { state.recipes[doc.id] = { ...doc.data(), id: doc.id }; });
      state.plan = mergePlan(pSnap.exists ? pSnap.data() : null);
      if (!sSnap.exists && !rSnap.size) {
        const ex = firstRun();
        render();
        try {
          await db.doc("app/settings").set(clone(state.settings));
          for (let i = 0; i < ex.length; i += 8) await Promise.all(ex.slice(i, i + 8).map(r => db.collection("recipes").doc(r.id).set(stripRecipe(r))));
          await db.doc("app/plan").set(clone(state.plan));
        } catch (e) { writeFailed(e); }
      }
      subscribe();
    } catch (e) {
      state.mode = "local"; loadLocal();
    }
  } else {
    state.mode = "local"; loadLocal();
  }
  render();
}
function loadLocal() {
  const r = lsGet("mpp.recipes"), s = lsGet("mpp.settings"), p = lsGet("mpp.plan");
  state.settings = mergeSettings(s);
  state.recipes = {};
  (r || []).forEach(x => state.recipes[x.id] = x);
  state.plan = mergePlan(p);
  if (!state.settings.seeded && !Object.keys(state.recipes).length) { firstRun(); persistLocal(); }
}
function subscribe() {
  db.collection("recipes").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const old = state.recipes[doc.id]; next[doc.id] = old && JSON.stringify(stripRecipe(old)) === JSON.stringify({ ...doc.data(), id: doc.id }) ? old : { ...doc.data(), id: doc.id }; });
    if (JSON.stringify(Object.keys(next).sort()) !== JSON.stringify(Object.keys(state.recipes).sort()) || Object.keys(next).some(k => next[k] !== state.recipes[k])) {
      state.recipes = next; poolCache.clear(); renderSoft();
    }
  }, () => {});
  db.doc("app/plan").onSnapshot(snap => {
    if (planTimer || !snap.exists) return;
    const j = JSON.stringify(snap.data());
    if (j === lastPlanJSON || j === JSON.stringify(state.plan)) return;
    state.plan = mergePlan(snap.data()); renderSoft();
  }, () => {});
  db.doc("app/settings").onSnapshot(snap => {
    if (settingsTimer || !snap.exists) return;
    const j = JSON.stringify(snap.data());
    if (j === lastSettingsJSON || j === JSON.stringify(state.settings)) return;
    state.settings = mergeSettings(snap.data()); poolCache.clear(); renderSoft();
  }, () => {});
}
// Avoid re-rendering under someone typing in a form.

/* ---------- rendering ---------- */
let toastTimer;

}
function macroDot(v) { return `<i style="background:var(${v})"></i>`; }

function weekSummary() {

function dayCard(d) {

function macroSummary(r, mult, hi, note) {

function viewRecipes() {

  const SORTS = {
    cuisine: ["Cuisine, then name", (a, b) => a.cuisine.localeCompare(b.cuisine) || a.name.localeCompare(b.name)],
    name: ["Name (A–Z)", (a, b) => a.name.localeCompare(b.name)],
    protein: ["Most protein", (a, b) => b.p - a.p],
    density: ["Most protein per calorie", (a, b) => b.p / (b.cal || 1) - a.p / (a.cal || 1)],
    cal: ["Fewest calories", (a, b) => a.cal - b.cal],
    carbs: ["Fewest carbs", (a, b) => a.c - b.c],
    fat: ["Least fat", (a, b) => a.f - b.f]
  };
  const sort = SORTS[state.rsort] ? state.rsort : "cuisine";
  const list = all.filter(r => (!state.rcuisine || r.cuisine === state.rcuisine) && (!q || r.name.toLowerCase().includes(q) || r.ingredients.some(i => i.item.includes(q))))
    .sort((a, b) => SORTS[sort][1](a, b) || a.name.localeCompare(b.name));
  const exCount = all.filter(r => r.example).length;
  const hi = { protein: "p", density: "p", cal: "cal", carbs: "c", fat: "f" }[sort];
  const rows = list.map(r => {
    const pc = r.p * 4, cc = r.c * 4, fc = r.f * 9, tot = (pc + cc + fc) || 1;
    const split = `<div class="split" title="Share of calories: protein ${Math.round(pc / tot * 100)}%, carbs ${Math.round(cc / tot * 100)}%, fat ${Math.round(fc / tot * 100)}%"><span style="width:${pc / tot * 100}%;background:var(--protein)"></span><span style="width:${cc / tot * 100}%;background:var(--carb)"></span><span style="width:${fc / tot * 100}%;background:var(--fat)"></span></div>`;
    return `<div class="rrow">
    <div class="rname"><div class="nm"><button class="linkish" data-action="view" data-id="${esc(r.id)}">${esc(r.name)}</button>${r.example ? `<span class="tag">Example</span>` : ""}</div>
      <div class="sub">${esc(r.cuisine)} · ${r.meals.map(m => SLOTS.find(s => s[0] === m)[1]).join(", ") || "Base recipe"} · makes ${r.servings}</div>${split}</div>
    ${macroSummary(r, 1, hi)}
    <div class="ractions">${state.readOnly ? "" : `<button class="btn small" data-action="edit" data-id="${esc(r.id)}">Edit</button><button class="btn ghost small" data-action="del" data-id="${esc(r.id)}">Delete</button>`}</div>
  </div>`;
  }).join("");
  const head = `<div class="rhead">${list.length} recipe${list.length === 1 ? "" : "s"} · calories and macros are per serving</div>`;
  return `<div class="grid2" style="grid-template-columns:minmax(0,1fr)">
    ${state.editing ? editorPanel() : ""}
    ${state.importing ? importPanel() : ""}
    <section class="panel">
      <div class="row">
        <h2>Recipes</h2><span class="spacer"></span>
        ${state.readOnly ? "" : `<button class="btn primary" data-action="new">Add recipe</button><button class="btn" data-action="import">Import recipes</button>`}
      </div>
      <div class="row">
        <div class="field" style="flex:1;min-width:180px"><input id="rsearch" type="search" placeholder="Search by name or ingredient" value="${esc(state.rsearch)}" aria-label="Search recipes"></div>
        <div class="field"><select id="rcuisine" aria-label="Filter by cuisine"><option value="">All cuisines</option>${cs.map(c => `<option ${state.rcuisine === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
        <div class="field"><select id="rsort" aria-label="Sort recipes">${Object.entries(SORTS).map(([k, [label]]) => `<option value="${k}" ${sort === k ? "selected" : ""}>Sort: ${label}</option>`).join("")}</select></div>
      </div>
      ${exCount && !state.readOnly ? `<div class="notice">${exCount} example recipes are loaded so you can try the planner. <button class="btn small" data-action="remove-examples">Remove examples</button></div>` : ""}
      <div class="rlist">${rows ? head + rows : `<p class="muted">No recipes match.</p>`}</div>
    </section></div>`;
}

// Recipe detail sheet. With a portion (opened from the plan) amounts are scaled to that portion.
let viewing = null, lastFocus = null;
function openRecipe(id, x, from) {
  if (!state.recipes[id]) return;
  lastFocus = from || document.activeElement;
  viewing = { id, x: x ? +x : null };
  renderSheet();
  document.getElementById("sheet-close")?.focus();
}
function closeRecipe() {
  viewing = null; renderSheet();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
function renderSheet() {
  const el = document.getElementById("sheet");
  const r = viewing && state.recipes[viewing.id];
  if (!r) { el.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";
  const x = viewing.x, mult = x ? x / (r.servings || 1) : 1;
  const per = x || 1;
  const facts = [["cal", "kcal", ""], ["p", "Protein", "g"], ["c", "Carbs", "g"], ["f", "Fat", "g"]]
    .map(([k, l, u]) => `<div><span class="v">${Math.round(r[k] * per)}${u}</span><span class="k">${k === "cal" ? "" : macroDot({ p: "--protein", c: "--carb", f: "--fat" }[k])}${l}</span></div>`).join("");
  const ings = r.ingredients.map(i => {
    let q = "";
    if (i.qty != null && !isNaN(i.qty)) {
      const u = UNITS[i.unit] || [i.unit || "", 1];
      q = fmtAmount(u[0], i.qty * u[1] * mult);
    }
    return `<li><span class="q">${esc(q)}</span><span class="${q ? "" : "neg"}">${esc(i.item)}</span></li>`;
  }).join("");
  const steps = (r.steps || []).length
    ? `<ol class="steps">${r.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>`
    : `<p class="muted">No instructions saved for this recipe yet.${state.readOnly ? "" : ` <button class="btn small" data-action="edit-from-sheet" data-id="${esc(r.id)}">Add instructions</button>`}</p>`;
  const meals = r.meals.map(m => SLOTS.find(s => s[0] === m)[1]).join(", ");
  const portionNote = x ? `Amounts for your ${x === 1 && r.servings === 1 ? "portion" : `×${x} serving portion`}` : (r.servings > 1 ? `Whole recipe · makes ${r.servings}` : "One serving");
  el.innerHTML = `<div class="sheet-back" data-action="close-sheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">${esc(r.name)}<div class="sub">${esc(r.cuisine)} · ${esc(meals)}${r.source ? " · " + esc(r.source) : ""}</div></h2>
        <button class="close" id="sheet-close" data-action="close-sheet" aria-label="Close recipe">×</button>
      </div>
      ${macroSummary(r, 1, null, "Per serving")}
      ${x && x !== 1 ? `<div><h3><span>Your portion: ${x} servings</span></h3><div class="mfacts">${facts}</div></div>` : ""}
      ${mfpBlock(r, x)}
      <div><h3><span>Ingredients</span><span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(portionNote)}</span></h3><ul class="ilist">${ings}</ul></div>
      <div><h3><span>Instructions</span></h3>${steps}</div>
      ${state.readOnly ? "" : `<div class="row"><button class="btn small" data-action="edit-from-sheet" data-id="${esc(r.id)}">Edit recipe</button></div>`}
    </div></div>`;
  drawBarcode(r);
}

/* ---------- MyFitnessPal ---------- */
// MyFitnessPal's Quick Add asks for calories, carbs, fat and protein, in that order.
function mfpNumbers(r, x) {
  const m = x || 1;
  return { cal: Math.round(r.cal * m), c: Math.round(r.c * m), f: Math.round(r.f * m), p: Math.round(r.p * m) };
}
function mfpLine(r, x, label) {
  const n = mfpNumbers(r, x);
  return `${label ? label + ": " : ""}${r.name}${x && x !== 1 ? ` (×${x})` : ""}\n  Calories ${n.cal} · Carbs ${n.c} g · Fat ${n.f} g · Protein ${n.p} g`;
}
// Coach Greg recipes carry the barcode printed in their pack (r.mfp). Every other recipe gets its own
// code, derived from its id so it never changes: a UPC-A starting with "29", the range reserved for
// in-store use, so it can't collide with a packaged product. MyFitnessPal won't know these codes until
// the first scan, when it offers to create a food for the barcode.
function barcodeFor(r) {
  if (r.mfp && r.mfp.code) return { format: r.mfp.format === "UPCE" ? "UPCE" : "UPC", code: r.mfp.code, generated: false };
  let h = 2166136261;
  for (const ch of String(r.id)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const body = "29" + String(h % 1e9).padStart(9, "0");
  let sum = 0;
  for (let i = 0; i < 11; i++) sum += (+body[i]) * (i % 2 === 0 ? 3 : 1);
  return { format: "UPC", code: body + ((10 - sum % 10) % 10), generated: true };
}
function mfpBlock(r, x) {
  const n = mfpNumbers(r, x), bc = barcodeFor(r), per = mfpNumbers(r, 1);
  const portion = x && x !== 1 ? `, then set servings to ${x}` : "";
  const scan = `<div class="barcode"><svg id="mfp-barcode" role="img" aria-label="Barcode ${esc(bc.code)}"></svg><span>${bc.generated ? "Your barcode for this recipe" : "Scan in MyFitnessPal" + portion}</span></div>`;
  const setup = bc.generated
    ? `<p class="first-scan"><b>First scan only:</b> MyFitnessPal won't recognise this barcode yet. Choose to create a food for it, name it <b>${esc(r.name)}</b>, set one serving to ${per.cal} kcal, ${per.c} g carbs, ${per.f} g fat and ${per.p} g protein, and save. After that, scanning it logs this recipe${portion}.</p>`
    : "";
  return `<div><h3><span>Log in MyFitnessPal</span></h3>
    <div class="mfp-row">${scan}
      <div class="quick">
        <p>Or use Quick Add with these numbers ${x ? "for this portion" : "per serving"}:</p>
        <dl><dt>Calories</dt><dd>${n.cal}</dd><dt>Carbs</dt><dd>${n.c} g</dd><dt>Fat</dt><dd>${n.f} g</dd><dt>Protein</dt><dd>${n.p} g</dd></dl>
        <div class="row"><button class="btn small" data-action="copy-mfp" data-id="${esc(r.id)}" data-x="${x || ""}">Copy for Quick Add</button></div>
      </div>
    </div>${setup}</div>`;
}
function drawBarcode(r) {
  const el = document.getElementById("mfp-barcode");
  if (!el) return;
  const bc = barcodeFor(r);
  try {
    window.JsBarcode(el, bc.code, { format: bc.format, background: "#ffffff", lineColor: "#000000", width: 2, height: 64, margin: 8, fontSize: 14 });
  } catch { el.closest(".barcode").innerHTML = `<span>Barcode ${esc(bc.code)}: type it into MyFitnessPal's barcode search</span>`; }
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch { toast("Copying isn't allowed here. The numbers are shown on the recipe instead."); }
}
function mfpDayText(d) {
  const day = state.plan.days[d], lines = [];
  for (const s of activeSlots()) {
    const c = day.slots[s], r = c && state.recipes[c.id];
    if (r) lines.push(mfpLine(r, c.x || 1, SLOTS.find(x => x[0] === s)[1]));
  }
  const st = dayStatus(d);
  lines.push(`Total: Calories ${Math.round(st.tot.cal)} · Carbs ${Math.round(st.tot.c)} g · Fat ${Math.round(st.tot.f)} g · Protein ${Math.round(st.tot.p)} g`);
  return `${DAYS[d]} for MyFitnessPal Quick Add\n` + lines.join("\n");
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pendingDelete) closeDialog(); else if (viewing) closeRecipe();
});

// Deleting a recipe takes two steps: the Delete button opens this dialog, and only its Delete recipe button deletes.
let pendingDelete = null, deleteReturn = null;
function askDelete(id, from) {
  if (!state.recipes[id]) return;
  pendingDelete = id; deleteReturn = from || null;
  renderDialog();
  document.getElementById("dlg-cancel")?.focus();
}
function closeDialog() {
  pendingDelete = null; renderDialog();
  if (deleteReturn && deleteReturn.isConnected) deleteReturn.focus();
}
function renderDialog() {
  const el = document.getElementById("dialog");
  const r = pendingDelete && state.recipes[pendingDelete];
  if (!r) { el.innerHTML = ""; return; }
  let used = 0;
  state.plan.days.forEach(day => { for (const s in day.slots) if (day.slots[s] && day.slots[s].id === r.id) used++; });
  el.innerHTML = `<div class="dlg-back" data-action="cancel-del">
    <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
      <h2 id="dlg-title">Are you sure you want to delete this recipe?</h2>
      <p id="dlg-desc"><b>${esc(r.name)}</b> will be removed from your recipes${used ? ` and from ${used} meal${used > 1 ? "s" : ""} in your week plan` : ""}. This can't be undone.</p>
      <div class="row dlg-actions"><button class="btn" id="dlg-cancel" data-action="cancel-del">Cancel</button><button class="btn danger" data-action="confirm-del" data-id="${esc(r.id)}">Delete recipe</button></div>
    </div></div>`;
}

function viewTargets() {
  const S = state.settings, t = S.targets;
  const fromMacros = Math.round(t.p * 4 + t.c * 4 + t.f * 9);
  const diff = fromMacros - t.cal;
  const dis = state.readOnly ? "disabled" : "";
  return `<div class="grid2">
    <section class="panel form">
      <h2>Daily targets</h2>
      <div class="fgrid">
        ${MACROS.map(([k, l, u]) => `<div class="field"><label for="t-${k}">${l} (${u})</label><input id="t-${k}" type="number" min="0" data-target="${k}" value="${t[k]}" ${dis}></div>`).join("")}
      </div>
      <p class="hint">Your macros add up to <b class="num">${fromMacros.toLocaleString()} kcal</b> (4 per gram of protein and carbs, 9 per gram of fat)${Math.abs(diff) > 40 ? `, ${Math.abs(diff)} ${diff > 0 ? "more" : "less"} than your calorie target. Plans will struggle to hit both. <button class="btn small" data-action="sync-cal" ${dis}>Use ${fromMacros}</button>` : "."}</p>
      <h2>How close is close enough</h2>
      <div class="fgrid">
        ${MACROS.map(([k, l]) => `<div class="field"><label for="tol-${k}">${l} ± %</label><input id="tol-${k}" type="number" min="1" max="50" data-tol="${k}" value="${S.tol[k]}" ${dis}></div>`).join("")}
      </div>
      <p class="hint">A day counts as on target when every number is inside its band. Tighter bands mean fewer possible plans.</p>
    </section>
    <section class="panel form">
      <h2>Meals and portions</h2>
      <div class="field"><span class="label">Meals each day</span><div class="checks">${SLOTS.map(([k, l]) => `<label><input type="checkbox" id="ms-${k}" data-mslot="${k}" ${S.slots[k] ? "checked" : ""} ${dis}> ${l}</label>`).join("")}</div></div>
      <div class="fgrid">
        <div class="field"><label for="pmin">Smallest portion (servings)</label><input id="pmin" type="number" min="0.25" max="3" step="0.25" data-setting="portionMin" value="${S.portionMin}" ${dis}></div>
        <div class="field"><label for="pmax">Largest portion (servings)</label><input id="pmax" type="number" min="0.5" max="4" step="0.25" data-setting="portionMax" value="${S.portionMax}" ${dis}></div>
        <div class="field"><label for="maxrep">Max days per recipe</label><input id="maxrep" type="number" min="1" max="7" step="1" data-setting="maxRepeat" value="${S.maxRepeat}" ${dis}></div>
      </div>
      <p class="hint">Allowing a recipe on more days means fewer groceries and more batch cooking. Lower it for more variety.</p>
    </section></div>`;
}

/* ---------- events ---------- */
function setTab(t) {
  state.tab = t; lsSet("mpp.tab", t);
  try { history.replaceState(null, "", "#" + t); } catch {}
  render();
}
function allDays() { return DAYS.map((_, i) => i); }
function afterGenerate(res, what) {
  savePlan(); render();
  if (res.skipped.length) toast(`No recipes fit ${res.skipped.map(d => DAYS[d]).join(", ")}. Add recipes for every meal or widen the cuisine filter.`);
  else if (res.offTarget.length) toast(`${res.offTarget.map(d => DAYS[d]).join(", ")} can't hit every target with these recipes. Try wider tolerances or more recipes.`);
  else toast(what);
}
function busy(fn) {
  document.body.style.cursor = "progress";
  setTimeout(() => { try { fn(); } finally { document.body.style.cursor = ""; } }, 10);
}

document.addEventListener("click", async e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) return setTab(tabBtn.dataset.tab);
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const a = b.dataset.action, d = +b.dataset.d, S = state.settings;
  if (a === "close-sheet") { if (e.target === b || b.id === "sheet-close") closeRecipe(); return; }
  if (a === "cancel-del") { if (e.target === b || b.tagName === "BUTTON") closeDialog(); return; }
  if (a === "view") return openRecipe(b.dataset.id, b.dataset.x, b);
  if (a === "copy-mfp") { const r = state.recipes[b.dataset.id]; if (r) copyText(mfpLine(r, b.dataset.x ? +b.dataset.x : null), "Copied. Paste into MyFitnessPal Quick Add."); return; }
  if (a === "copy-mfp-day") return copyText(mfpDayText(d), `Copied ${DAYS[d]}'s meals for MyFitnessPal.`);
  if (state.readOnly && !["goto","copy-list"].includes(a)) return;
  switch (a) {
    case "edit-from-sheet": viewing = null; renderSheet(); state.editing = b.dataset.id; state.importing = false; state.tab = "recipes"; render(); window.scrollTo({ top: 0 }); return;
    case "goto": state.editing = null; return setTab(b.dataset.tab);
    case "cuisine-all": S.cuisines = []; saveSettings(); return render();
    case "cuisine": {
      const c = b.dataset.c;
      S.cuisines = S.cuisines.includes(c) ? S.cuisines.filter(x => x !== c) : [...S.cuisines, c];
      saveSettings(); return render();
    }
    case "gen-lean": return busy(() => {
      const before = weekSummary().items;
      const res = generate("lean", allDays());
      afterGenerate(res, `Planned the week with ${weekSummary().items} grocery items.`);
    });
    case "gen-random": return busy(() => afterGenerate(generate("random", allDays()), "Here's a random week. Every day still hits your targets."));
    case "fill-empty": return busy(() => {
      const days = allDays().filter(i => !dayStatus(i).complete);
      if (!days.length) return toast("Every day is already filled.");
      afterGenerate(generate("lean", days), `Filled ${days.length} day${days.length > 1 ? "s" : ""}.`);
    });
    case "fill-day": case "fix-day": return busy(() => afterGenerate(generate("lean", [d]), `${DAYS[d]} is balanced.`));
    case "reroll-day": return busy(() => afterGenerate(generate("random", [d]), `New meals for ${DAYS[d]}.`));
    case "clear-unlocked":
      state.plan.days.forEach(day => { for (const s in day.slots) if (!day.slots[s] || !day.slots[s].locked) delete day.slots[s]; });
      savePlan(); return render();
    case "clear-all":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to clear"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Clear all"; } }, 3000); return; }
      state.plan = { ...emptyPlan(), checked: {} }; savePlan(); return render();
    case "lock": {
      const c = state.plan.days[d].slots[b.dataset.s]; if (!c) return;
      c.locked = !c.locked; savePlan(); return render();
    }
    case "copy-list": {
      const { items } = groceries();
      const txt = CATS.map(cat => {
        const l = items.filter(i => (CATS.includes(i.category) ? i.category : "Other") === cat).sort((x, y) => x.name.localeCompare(y.name));
        return l.length ? cat + "\n" + l.map(g => `- ${g.name}: ${amountText(g)}`).join("\n") : "";
      }).filter(Boolean).join("\n\n");
      try { await navigator.clipboard.writeText(txt); toast("Grocery list copied."); }
      catch { const ta = document.createElement("textarea"); ta.value = txt; ta.className = "code"; b.closest(".panel").prepend(ta); ta.select(); toast("Select-all is ready. Copy with your keyboard."); }
      return;
    }
    case "uncheck": state.plan.checked = {}; savePlan(); return render();
    case "load-examples": await saveRecipes(exampleRecipes()); toast("Example recipes loaded."); return render();
    case "remove-examples": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to remove"; return; }
      const ids = Object.values(state.recipes).filter(r => r.example).map(r => r.id);
      await deleteRecipes(ids); toast(`Removed ${ids.length} examples.`); return render();
    }
    case "new": state.editing = "new"; state.importing = false; render(); document.getElementById("f-name")?.focus(); return;
    case "edit": state.editing = b.dataset.id; state.importing = false; render(); window.scrollTo({ top: 0 }); return;
    case "cancel-edit": state.editing = null; return render();
    case "del": return askDelete(b.dataset.id, b);
    case "confirm-del": {
      const id = b.dataset.id, name = state.recipes[id]?.name;
      pendingDelete = null; renderDialog();
      let removed = 0;
      state.plan.days.forEach(day => { for (const s in day.slots) if (day.slots[s] && day.slots[s].id === id) { delete day.slots[s]; removed++; } });
      if (removed) savePlan();
      await deleteRecipes([id]);
      toast(`Deleted ${name}.${removed ? ` Cleared it from ${removed} meal${removed > 1 ? "s" : ""} in your plan.` : ""}`);
      return render();
    }
    case "import": state.importing = true; state.editing = null; render(); document.getElementById("imp-text")?.focus(); return;
    case "cancel-import": state.importing = false; return render();
    case "do-import": {
      const text = document.getElementById("imp-text").value, out = document.getElementById("imp-result");
      if (!text.trim()) return;
      let res;
      try { res = parseImport(text, { totals: document.getElementById("imp-totals").checked }); }
      catch (err) { out.innerHTML = `<div class="notice">That didn't parse. Check that it's valid JSON or a CSV with a header row. (${esc(err.message)})</div>`; return; }
      if (res.ok.length) await saveRecipes(res.ok);
      state.importing = !!res.bad.length;
      render();
      toast(`Imported ${res.ok.length} recipe${res.ok.length === 1 ? "" : "s"}.`);
      if (res.bad.length) {
        document.getElementById("imp-text").value = text;
        document.getElementById("imp-result").innerHTML = `<div class="notice">Imported ${res.ok.length}. Skipped ${res.bad.length}:<br>${res.bad.map(esc).join("<br>")}</div>`;
      }
      return;
    }
    case "sync-cal": S.targets.cal = Math.round(S.targets.p * 4 + S.targets.c * 4 + S.targets.f * 9); saveSettings(); return render();
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (state.readOnly) return;
  if (t.matches("select[data-s]")) {
    const d = +t.dataset.d, s = t.dataset.s, day = state.plan.days[d];
    if (t.value) day.slots[s] = { id: t.value, x: 1, locked: true }; else delete day.slots[s];
    rebalance(d); savePlan(); return render();
  }
  if (t.matches("select[data-daycuisine]")) {
    state.plan.days[+t.dataset.daycuisine].cuisine = t.value; savePlan();
    const d = +t.dataset.daycuisine;
    if (t.value) return busy(() => afterGenerate(generate("lean", [d]), `${DAYS[d]} is now a ${t.value} day.`));
    return render();
  }
  if (t.matches("input[data-gkey]")) {
    state.plan.checked = state.plan.checked || {};
    if (t.checked) state.plan.checked[t.dataset.gkey] = true; else delete state.plan.checked[t.dataset.gkey];
    t.closest(".gitem").classList.toggle("done", t.checked);
    return savePlan();
  }
  const S = state.settings;
  if (t.matches("[data-target]")) { const v = parseFloat(t.value); if (v >= 0) { S.targets[t.dataset.target] = v; saveSettings(); render(); } return; }
  if (t.matches("[data-tol]")) { const v = parseFloat(t.value); if (v > 0) { S.tol[t.dataset.tol] = v; saveSettings(); render(); } return; }
  if (t.matches("[data-mslot]")) { S.slots[t.dataset.mslot] = t.checked; saveSettings(); state.plan.days.forEach((_, d) => rebalance(d)); savePlan(); return render(); }
  if (t.matches("[data-setting]")) {
    const v = parseFloat(t.value); if (!(v > 0)) return;
    S[t.dataset.setting] = v;
    if (S.portionMin > S.portionMax) S.portionMax = S.portionMin;
    saveSettings(); return render();
  }
  if (t.id === "rcuisine") { state.rcuisine = t.value; return render(); }
  if (t.id === "rsort") { state.rsort = t.value; lsSet("mpp.rsort", t.value); return render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "rsearch") {
    state.rsearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("rsearch"); el.focus(); el.setSelectionRange(pos, pos);
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "recipe-form") return;
  e.preventDefault();
  const val = id => document.getElementById(id).value;
  const meals = SLOTS.map(s => s[0]).filter(k => document.getElementById("f-meal-" + k).checked);
  try {
    const r = normalizeRecipe({
      id: state.editing === "new" ? undefined : state.editing,
      name: val("f-name"), cuisine: val("f-cuisine") || "Other", meals: meals.length ? meals : ["lunch","dinner"],
      servings: val("f-serv"), calories: val("f-cal"), protein: val("f-p"), carbs: val("f-c"), fat: val("f-f"),
      ingredients: val("f-ing").split("\n").filter(l => l.trim()),
      steps: val("f-steps").split("\n").filter(l => l.trim()),
      example: state.editing !== "new" && state.recipes[state.editing]?.example,
      source: state.editing !== "new" ? state.recipes[state.editing]?.source : undefined
    });
    await saveRecipes([r]);
    state.editing = null; toast(`Saved ${r.name}.`); render();
  } catch (err) { toast(`Can't save: the recipe is ${err.message}.`); }
});

/* ---------- start ---------- */
(function init() {
  const h = (location.hash || "").slice(1);
  state.tab = ["plan","groceries","recipes","targets"].includes(h) ? h : (lsGet("mpp.tab") || "plan");
  if (!window.claude || !window.claude.use) { state.mode = "local"; loadLocal(); render(); return; }
  boot();
})();
</script>
