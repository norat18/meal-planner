<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Prep Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working week board. Nutrition-label header strip on top, tabbed tool below, one day card per row. */
:root {
  --bg: #F3F6F2;
  --surface: #FFFFFF;
  --ink: #17211B;
  --muted: #5B6A61;
  --line: #D8E0DA;
  --accent: #2C6A4C;
  --accent-ink: #FFFFFF;
  --soft: #E3EEE7;
  --protein: #8A4A9B;
  --carb: #B97D12;
  --fat: #2A7499;
  --ok: #2E8549;
  --warn: #BF5130;
  --band: rgba(44,106,76,.13);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1511; --surface: #172019; --ink: #E5EDE7; --muted: #98A79E; --line: #2A362E;
    --accent: #72C196; --accent-ink: #0B170F; --soft: #1E2C23;
    --protein: #CB92DA; --carb: #E4B14C; --fat: #6DB9DC; --ok: #6ECF8D; --warn: #F08C66;
    --band: rgba(114,193,150,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1511; --surface: #172019; --ink: #E5EDE7; --muted: #98A79E; --line: #2A362E;
  --accent: #72C196; --accent-ink: #0B170F; --soft: #1E2C23;
  --protein: #CB92DA; --carb: #E4B14C; --fat: #6DB9DC; --ok: #6ECF8D; --warn: #F08C66;
  --band: rgba(114,193,150,.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); }
.facts {
  border: 2px solid var(--ink); background: var(--surface); padding: 6px 12px 8px;
  display: grid; grid-template-columns: repeat(4, auto); column-gap: 18px; min-width: 0;
}
.facts .ft { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 800; font-size: 15px; border-bottom: 6px solid var(--ink); padding-bottom: 2px; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }
.facts .ft button { font: 600 12px var(--font-body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.facts div.f { display: grid; }
.facts .v { font-family: var(--font-data); font-size: 17px; font-weight: 500; }
.facts .k { font-size: 11px; color: var(--muted); }
.k i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button {
  background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted);
  font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-left: 4px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.statusline { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok::before { background: var(--ok); }
.pill.warn::before { background: var(--warn); }
.pill.warn { color: var(--warn); }

/* Toolbar */
.toolbar { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.spacer { flex: 1; }

/* Day cards */
.week { display: grid; gap: 12px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.day-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.day-head h3 { font-size: 19px; font-weight: 700; min-width: 108px; }
.day-head select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-size: 13px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; background: var(--bg); }
.slot.locked { border-color: var(--accent); }
.slot-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.lock { background: none; border: 0; cursor: pointer; padding: 2px 4px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 4px; }
.lock[aria-pressed="true"] { color: var(--accent); }
.slot select { width: 100%; min-width: 0; border: 0; background: transparent; font-weight: 600; font-size: 14px; padding: 2px 0; cursor: pointer; text-overflow: ellipsis; }
.slot-meta { font-size: 12px; color: var(--muted); font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.slot-meta b { color: var(--ink); font-weight: 500; }
.slot-link { font-size: 11.5px; color: var(--accent); margin-top: 2px; }

.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.meter { display: grid; gap: 4px; min-width: 0; }
.meter-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.meter-top .num { font-size: 12px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar .band { position: absolute; top: 0; bottom: 0; background: var(--band); }
.bar .fill { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 2px; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.meter.off .meter-top .num { color: var(--warn); }
@media (max-width: 640px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.panel h2 { font-size: 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Groceries */
.cat { display: grid; gap: 2px; }
.cat h3 { font-size: 14px; font-family: var(--font-body); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.gitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.gitem input { margin: 0; transform: translateY(2px); accent-color: var(--accent); }
.gitem .name { font-weight: 600; text-transform: capitalize; }
.gitem .used { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.gitem .amt { font-family: var(--font-data); font-size: 13px; text-align: right; }
.gitem.done .name, .gitem.done .amt { text-decoration: line-through; color: var(--muted); }
.prep li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.prep ul { list-style: none; margin: 0; padding: 0; }
.bigstat { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; }

/* Recipes */
.rlist { display: grid; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) 128px; gap: 6px 18px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rhead { padding: 2px 0 6px; border-bottom: 2px solid var(--ink); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.msum { display: grid; gap: 2px; justify-items: end; text-align: right; min-width: 0; }
.msum .kcal { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.msum .mline { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.msum .mline .sep { color: var(--muted); margin: 0 6px; }
.msum .lbl { color: var(--muted); font-weight: 600; }
.msum .hl { background: var(--soft); color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.msum .hl .lbl { color: var(--accent); }
.split { display: flex; height: 5px; width: min(160px, 100%); border-radius: 3px; overflow: hidden; margin-top: 5px; background: var(--soft); }
.split span { display: block; height: 100%; }
.ractions { display: flex; gap: 6px; justify-content: flex-end; }
.sheet .msum { justify-items: start; text-align: left; padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.sheet .msum .kcal { font-size: 24px; }
.sheet .msum .mline { font-size: 16px; white-space: normal; }
.sheet .msum .per { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) {
  .rrow { grid-template-columns: minmax(0, 1fr) auto; }
  .rrow .ractions { grid-column: 2; grid-row: 1; }
  .rrow .msum { grid-column: 1 / -1; grid-row: 2; justify-items: start; text-align: left; }
  .msum .mline { white-space: normal; }
}
.rrow .nm { font-weight: 600; }
.rrow .sub { font-size: 12px; color: var(--muted); }
.macros { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.macros span i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); margin-left: 6px; }

.form { display: grid; gap: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, textarea.code {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0;
}
textarea.code { font-family: var(--font-data); font-size: 12.5px; min-height: 180px; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink); font-weight: 500; }
.hint { font-size: 13px; color: var(--muted); max-width: 68ch; }
pre.sample { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12px/1.5 var(--font-data); margin: 0; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--accent); color: var(--accent); }
.slot-actions { display: flex; gap: 2px; }

/* Recipe sheet */
.sheet-back {
  position: fixed; inset: 0; background: rgba(10,16,12,.45); z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 680px; max-height: 100%;
  overflow-y: auto; padding: 20px 22px 24px; display: grid; gap: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.sheet-head { display: flex; gap: 12px; align-items: flex-start; }
.sheet-head h2 { font-size: clamp(22px, 3.4vw, 28px); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; flex: 1; }
.sheet-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: var(--font-body); font-weight: 400; letter-spacing: 0; }
.close { background: var(--soft); border: 0; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.mfacts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); }
.mfacts div { padding: 8px 0; display: grid; }
.mfacts div + div { border-left: 1px solid var(--line); padding-left: 12px; }
.mfacts .v { font-family: var(--font-data); font-size: 18px; font-weight: 500; }
.mfacts .k { font-size: 11px; color: var(--muted); }
.sheet h3 { font-size: 13px; font-family: var(--font-body); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.ilist { list-style: none; margin: 0; padding: 0; }
.ilist li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ilist .q { font-family: var(--font-data); font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.ilist .neg { color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; line-height: 1.55; max-width: 68ch; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
.dlg-back {
  position: fixed; inset: 0; z-index: 30; background: rgba(10,16,12,.5);
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dlg { background: var(--surface); color: var(--ink); border-radius: 12px; border-top: 4px solid var(--warn); width: 100%; max-width: 420px; padding: 20px 22px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dlg h2 { font-size: 19px; line-height: 1.25; }
.dlg p { margin: 0; color: var(--muted); }
.dlg p b { color: var(--ink); }
.dlg-actions { justify-content: flex-end; }
.btn.danger { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.danger:hover { filter: brightness(1.05); }
.mfp-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.barcode { background: #FFFFFF; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; justify-items: center; gap: 2px; max-width: 100%; }
.barcode svg { display: block; max-width: 100%; height: auto; }
.barcode span { font-size: 11px; color: #4A554E; }
.quick { display: grid; gap: 8px; min-width: 0; flex: 1 1 220px; }
.quick dl { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; margin: 0; justify-content: start; }
.quick dt { font-size: 11px; color: var(--muted); }
.quick dd { margin: 0; font-family: var(--font-data); font-size: 15px; font-variant-numeric: tabular-nums; grid-row: 2; }
.quick p { margin: 0; font-size: 13px; color: var(--muted); max-width: 52ch; }
.first-scan { margin: 10px 0 0; font-size: 13px; color: var(--muted); max-width: 68ch; border-left: 3px solid var(--accent); padding-left: 10px; }
.first-scan b { color: var(--ink); }
@media (max-width: 560px) {
  .sheet-back { align-items: flex-end; padding-bottom: 0; padding-left: 0; padding-right: 0; }
  .sheet { border-radius: 14px 14px 0 0; max-height: 92%; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .mfacts .v { font-size: 15px; }
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
  max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
@media (prefers-reduced-motion: no-preference) { .day { transition: border-color .2s; } }

/* Sign-in, onboarding, gate */
.hero { max-width: 560px; margin: 6vh auto 0; text-align: left; }
.hero h2 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 52ch; }
.account { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.gate { display: grid; gap: 10px; }
.progress { height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; max-width: 420px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.est { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--carb); margin-left: 6px; white-space: nowrap; }
.ctag { font-size: 11px; color: var(--muted); }
.cooked { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.cooked select { width: auto; font-weight: 500; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 2px; }
.have-btn { background: none; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.have-btn:hover { color: var(--ink); border-color: var(--accent); }
.gitem { grid-template-columns: auto minmax(0, 1fr) auto auto; }
.gitem .used { grid-column: 2 / -1; }
.ing-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ing-wrap { overflow-x: auto; }
.ing-table th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px; white-space: nowrap; }
.ing-table td { padding: 3px 4px; vertical-align: top; }
.ing-table input, .ing-table select { width: 100%; min-width: 60px; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 5px 6px; font-size: 13px; }
.ing-table td.q input { min-width: 56px; } .ing-table td.it input { min-width: 150px; } .ing-table td.pr input { min-width: 90px; }
.ing-table .orig { font-size: 11px; color: var(--muted); padding: 0 4px 6px; }
.rm { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }

/* ---------- recipe normalization & import ---------- */
function normMeals(v) {

function pick(o, keys) { for (const k of keys) { if (o[k] !== undefined && o[k] !== "") return o[k]; } return undefined; }

  if (isNaN(f)) f = parseFloat(pick(mac, ["fat","f"]));

    const item = String(pick(i, ["item","name","ingredient","food"]) || "").trim().toLowerCase();
    if (!item) return null;

    const extra = { ...(i.prep ? { prep: String(i.prep).trim() } : {}), ...(i.line ? { line: String(i.line) } : {}) };

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;

      if (!key) continue;

    if (e && /popup/.test(e.code || "")) return auth.signInWithRedirect(provider);
    toast("Sign-in didn't finish. Try again.");
  });
}
function signOut() { if (auth) auth.signOut(); }
function loadLocal() {
  const r = lsGet("mpp.recipes"), s = lsGet("mpp.settings"), p = lsGet("mpp.plan");
  state.settings = mergeSettings(s);
  state.recipes = {};
  (r || []).forEach(x => state.recipes[x.id] = x);
  state.plan = mergePlan(p);
}
function subscribe() {
  unsubs.push(db.collection("recipes").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const old = state.recipes[doc.id]; next[doc.id] = old && JSON.stringify(stripRecipe(old)) === JSON.stringify({ ...doc.data(), id: doc.id }) ? old : { ...doc.data(), id: doc.id }; });
    if (JSON.stringify(Object.keys(next).sort()) !== JSON.stringify(Object.keys(state.recipes).sort()) || Object.keys(next).some(k => next[k] !== state.recipes[k])) {
      state.recipes = next; poolCache.clear(); renderSoft();
    }
  }, () => {}));
  unsubs.push(db.doc("app/plan").onSnapshot(snap => {
    if (planTimer || !snap.exists) return;
    const j = JSON.stringify(snap.data());
    if (j === lastPlanJSON || j === JSON.stringify(state.plan)) return;
    state.plan = mergePlan(snap.data()); renderSoft();
  }, () => {}));
  unsubs.push(db.doc("app/settings").onSnapshot(snap => {
    if (settingsTimer || !snap.exists) return;
    const j = JSON.stringify(snap.data());
    if (j === lastSettingsJSON || j === JSON.stringify(state.settings)) return;
    state.settings = mergeSettings(snap.data()); poolCache.clear(); renderSoft();
  }, () => {}));
}
// Avoid re-rendering under someone typing in a form.
function renderSoft() {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && document.getElementById("view").contains(a)) { renderChrome(); return; }
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
}
function macroDot(v) { return `<i style="background:var(${v})"></i>`; }

function renderChrome() {
  const S = state.settings, T = S.targets, signedOut = state.mode === "signin" || state.mode === "loading";

    <div class="ft"><span>Daily target</span><button data-action="goto" data-tab="targets">Edit</button></div>

    <div class="f"><span class="v">${T.c}g</span><span class="k">${macroDot("--carb")}Carbs</span></div>

}
function needsOnboarding() { return state.mode === "db" && !state.settings.onboarded; }

function render() {
  renderChrome();
  const v = document.getElementById("view");
  if (state.mode === "loading") { v.innerHTML = `<div class="empty">Loading your recipes…</div>`; return; }
  if (state.mode === "signin") { v.innerHTML = viewSignIn(); return; }

function weekSummary() {
  let on = 0, complete = 0;
  state.plan.days.forEach((_, d) => { const s = dayStatus(d); if (s.complete) { complete++; if (s.feasible) on++; } });
  const g = groceries().items;
  return { on, complete, unique: g.filter(i => !i.have).length, have: g.filter(i => i.have).length };
}

function dayCard(d) {
  const day = state.plan.days[d], st = dayStatus(d), S = state.settings, act = activeSlots(), on = targetsOn();
  const cs = cuisines();
  let pill;
  if (st.complete && !on) pill = `<span class="pill ok">Planned</span>`;
  else if (st.complete && st.feasible) pill = `<span class="pill ok">On target</span>`;
  else if (st.complete) pill = `<span class="pill warn">${esc(dayMiss(d).text.replace(/^\w/, ch => ch.toUpperCase()))}</span>`;
  else pill = `<span class="pill">${st.filled} of ${st.need} picked</span>`;
  const slots = act.map(s => slotCell(d, s)).join("");
  const meters = !on ? "" : MACROS.map(([k, label, unit, color]) => {
    const t = S.targets[k], v = st.tot[k], tol = S.tol[k] / 100, scale = 1.3;
    const pct = x => Math.max(0, Math.min(100, x / scale * 100));
    const off = st.complete && Math.abs(st.dev[k]) > tol + 1e-9;
    return `<div class="meter ${off ? "off" : ""}">
      <div class="meter-top"><span>${label}</span><span class="num">${Math.round(v)}<span class="muted">/${t}${unit === "g" ? "g" : ""}</span></span></div>
      <div class="bar" role="img" aria-label="${label} ${Math.round(v)} of ${t} ${unit}">
        <span class="band" style="left:${pct(1 - tol)}%;width:${pct(1 + tol) - pct(1 - tol)}%"></span>
        <span class="fill" style="width:${t ? pct(v / t) : 0}%;background:var(${color})"></span>
        <span class="tick" style="left:calc(${pct(1)}% - 1px)"></span>
      </div></div>`;
  }).join("");
  const action = on && st.complete && !st.feasible ? `<button class="btn small" data-action="fix-day" data-d="${d}">Rebalance day</button>`
    : !st.complete ? `<button class="btn small" data-action="fill-day" data-d="${d}">Fill the rest</button>` : `<button class="btn ghost small" data-action="reroll-day" data-d="${d}">Reroll</button>`;
  return `<article class="day">
    <div class="day-head">
      <h3>${DAYS[d]}</h3>
      <select id="dc-${d}" data-daycuisine="${d}" aria-label="${DAYS[d]} cuisine">
        <option value="">Any cuisine</option>
        ${cs.map(c => `<option value="${esc(c)}" ${day.cuisine === c ? "selected" : ""}>${esc(c)} day</option>`).join("")}

    </div>
    <div class="slots">${slots}</div>

  </article>`;
}

function slotCell(d, s) {
  const day = state.plan.days[d], c = day.slots[s], r = c && state.recipes[c.id];
  const label = SLOTS.find(x => x[0] === s)[1];
  const L = linkMode(), on = targetsOn();
  const ids = s === "lunch" && L.lo ? eligibleIds("dinner", state.plan.days[(d + 6) % 7].cuisine) : slotChoices(d, s);
  let link = "";
  if (s === "lunch" && L.lo) link = `Leftovers from ${DAYS[(d + 6) % 7]}'s dinner`;
  else if (s === "dinner" && L.lo) link = `Makes ${DAYS[(d + 1) % 7]}'s lunch too`;
  else if (s === "breakfast" && L.bf) {
    const g = BF_GROUPS[bfGroup(d)];
    link = `Same breakfast ${DAYS[g[0]].slice(0, 3)}–${DAYS[g[g.length - 1]].slice(0, 3)}${bfGroup(d) === CAR_GROUP ? " · car-friendly" : ""}`;
  }
  if (r && !ids.includes(r.id)) ids.unshift(r.id);
  const byC = {};
  ids.forEach(id => { const x = state.recipes[id]; (byC[x.cuisine] = byC[x.cuisine] || []).push(x); });
  const opts = Object.keys(byC).sort().map(cu => `<optgroup label="${esc(cu)}">${byC[cu].sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${esc(x.id)}" ${r && r.id === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</optgroup>`).join("");
  const x = c ? c.x || 1 : 1;
  const meta = r ? (on ? `<b>×${x}</b> serving · ${Math.round(r.cal * x)} kcal · ${Math.round(r.p * x)}P ${Math.round(r.c * x)}C ${Math.round(r.f * x)}F${r.estimated ? ` <span class="est" title="Macros are estimates">est.</span>` : ""}` : `${esc(r.cuisine)}`)
    : (c && !r ? "Recipe was deleted" : "Choose a meal");
  // Cooking signal (share of plan cooked) and a 1–5 rating, on the slot where the meal is cooked.
  const key = `${d}-${s}`, ck = (state.plan.cooked || {})[key];
  const cooked = r && isCookSlot(d, s) ? `<div class="cooked"><label><input type="checkbox" data-cooked="${key}" ${ck ? "checked" : ""}> Cooked</label>${ck ? `<select data-rating="${key}" aria-label="Rate this meal"><option value="">Rate</option>${[5,4,3,2,1].map(n => `<option value="${n}" ${ck.rating === n ? "selected" : ""}>${"★".repeat(n)}</option>`).join("")}</select>` : ""}</div>` : "";
  return `<div class="slot ${c && c.locked ? "locked" : ""}">
    <div class="slot-top"><span class="label">${label}${r && on ? ` <span class="ctag">· ${esc(r.cuisine)}</span>` : ""}</span>
      ${r ? `<span class="slot-actions"><button class="lock" data-action="view" data-id="${esc(r.id)}" data-x="${x}" title="Ingredients and instructions">Recipe</button><button class="lock" data-action="lock" data-d="${d}" data-s="${s}" aria-pressed="${!!c.locked}" title="${c.locked ? "Pinned: the planner won't change this" : "Pin this meal"}">${c.locked ? "Pinned" : "Pin"}</button></span>` : ""}
    </div>
    <select id="sl-${d}-${s}" data-d="${d}" data-s="${s}" aria-label="${DAYS[d]} ${label}">
      <option value="">— Empty —</option>${opts}
    </select>
    <div class="slot-meta">${meta}</div>${link ? `<div class="slot-link">${esc(link)}</div>` : ""}${cooked}
  </div>`;
}

function viewGroceries() {
  const { items, cook } = groceries(), H = household();
  if (!items.length) return `<div class="panel empty"><h2>Your list is empty</h2><p>Plan some meals and the grocery list builds itself.</p><button class="btn primary" data-action="goto" data-tab="plan">Go to week plan</button></div>`;
  const checked = state.plan.checked || {};
  const buy = items.filter(i => !i.have), have = items.filter(i => i.have);

        <label class="name" for="g-${keyId(g.key)}">${esc(g.name)}</label><span class="amt">${esc(amountText(g))}</span>
        <button class="have-btn" data-action="have" data-key="${esc(g.key)}" title="Hide this from future lists until you add it back">I already have this</button>
        <span class="used">${esc([...g.used].join(", "))}</span></div>`).join("")}</div>`;
  }).join("");
  const haveList = have.length ? `<details class="cat"><summary class="label" style="cursor:pointer;padding:10px 0">Items you already have (${have.length}), hidden from the list</summary>
      ${have.sort((a, b) => a.name.localeCompare(b.name)).map(g => `<div class="gitem"><span></span><span class="name">${esc(g.name)}</span><span class="amt muted">${esc(amountText(g))}</span>
        <button class="have-btn" data-action="unhave" data-key="${esc(g.key)}">Running low? Add back</button></div>`).join("")}</details>` : "";
  const otherHave = (state.settings.have || []).filter(k => !items.some(i => i.key === k));
  const prep = cook.sort((a, b) => b.portions - a.portions).map(c => {

    return `<li><button class="linkish" style="font-weight:600" data-action="view" data-id="${esc(c.r.id)}">${esc(c.r.name)}</button><br><span class="muted num" style="font-size:13px">${+c.portions.toFixed(2)} servings for ${H} ${H === 1 ? "person" : "people"}${left} · cook ${batches > 1 ? batches + " batches" : "1 batch"} (recipe makes ${c.r.servings})</span></li>`;
  }).join("");
  return `<div class="grid2">
    <section class="panel">
      <div class="row"><div><div class="bigstat num">${buy.length}</div><div class="muted">items to buy for ${H} ${H === 1 ? "person" : "people"}${have.length ? `, plus ${have.length} you already have` : ""}</div></div>
        <span class="spacer"></span><button class="btn" data-action="copy-list">Copy list</button><button class="btn ghost small" data-action="uncheck">Uncheck all</button></div>
      ${groups}
      ${haveList}
      ${otherHave.length ? `<p class="hint">You also marked ${otherHave.length} item${otherHave.length === 1 ? "" : "s"} you have that this week doesn't use.</p>` : ""}
    </section>
    <aside class="panel prep">
      <h2>Prep list</h2>
      <p class="hint">What to cook this week. Servings beyond one meal become leftovers for a later meal; amounts on the list already include them.</p>
      <ul>${prep}</ul>
    </aside>
  </div>`;
}

// "576 kcal" over "Protein: 40g | Carbs: 58g | Fat: 20g". mult scales to a portion; hi highlights the sorted value.
function macroSummary(r, mult, hi, note) {
  const m = mult || 1, n = v => +(v * m).toFixed(1);
  const part = (k, label) => `<span class="${hi === k ? "hl" : ""}"><span class="lbl">${label}:</span> ${n(r[k])}g</span>`;
  return `<div class="msum">${note ? `<span class="per">${note}</span>` : ""}<span class="kcal ${hi === "cal" ? "hl" : ""}">${Math.round(r.cal * m)} kcal</span>
    <span class="mline">${part("p", "Protein")}<span class="sep">|</span>${part("c", "Carbs")}<span class="sep">|</span>${part("f", "Fat")}</span></div>`;
}

function viewRecipes() {
  const all = Object.values(state.recipes);
  const cs = cuisines();
  const q = state.rsearch.toLowerCase();
  const SORTS = {
    cuisine: ["Cuisine, then name", (a, b) => a.cuisine.localeCompare(b.cuisine) || a.name.localeCompare(b.name)],
    name: ["Name (A–Z)", (a, b) => a.name.localeCompare(b.name)],
    protein: ["Most protein", (a, b) => b.p - a.p],
    density: ["Most protein per calorie", (a, b) => b.p / (b.cal || 1) - a.p / (a.cal || 1)],
    cal: ["Fewest calories", (a, b) => a.cal - b.cal],
    carbs: ["Fewest carbs", (a, b) => a.c - b.c],
    fat: ["Least fat", (a, b) => a.f - b.f]
  };
  const sort = SORTS[state.rsort] ? state.rsort : "cuisine";
  const list = all.filter(r => (!state.rcuisine || r.cuisine === state.rcuisine) && (!q || r.name.toLowerCase().includes(q) || r.ingredients.some(i => i.item.includes(q))))
    .sort((a, b) => SORTS[sort][1](a, b) || a.name.localeCompare(b.name));
  const exCount = all.filter(r => r.example).length;
  const hi = { protein: "p", density: "p", cal: "cal", carbs: "c", fat: "f" }[sort];
  const rows = list.map(r => {
    const pc = r.p * 4, cc = r.c * 4, fc = r.f * 9, tot = (pc + cc + fc) || 1;
    const split = `<div class="split" title="Share of calories: protein ${Math.round(pc / tot * 100)}%, carbs ${Math.round(cc / tot * 100)}%, fat ${Math.round(fc / tot * 100)}%"><span style="width:${pc / tot * 100}%;background:var(--protein)"></span><span style="width:${cc / tot * 100}%;background:var(--carb)"></span><span style="width:${fc / tot * 100}%;background:var(--fat)"></span></div>`;
    return `<div class="rrow">
    <div class="rname"><div class="nm"><button class="linkish" data-action="view" data-id="${esc(r.id)}">${esc(r.name)}</button>${r.example ? `<span class="tag">Example</span>` : ""}${r.estimated ? `<span class="est" title="Calories and macros are estimates, not from the source">Estimated macros</span>` : ""}</div>
      <div class="sub">${esc(r.cuisine)} · ${r.meals.map(m => SLOTS.find(s => s[0] === m)[1]).join(", ") || "Base recipe"} · makes ${r.servings}${r.portable ? " · car-friendly" : ""}</div>${split}</div>
    ${macroSummary(r, 1, hi)}
    <div class="ractions">${state.readOnly ? "" : `<button class="btn small" data-action="edit" data-id="${esc(r.id)}">Edit</button><button class="btn ghost small" data-action="del" data-id="${esc(r.id)}">Delete</button>`}</div>
  </div>`;
  }).join("");
  const head = `<div class="rhead">${list.length} recipe${list.length === 1 ? "" : "s"} · calories and macros are per serving · visible only to you</div>`;

// Every ingredient name in the library, so a line can be mapped to one the grocery list already knows.
function knownIngredients() {

}

// Import: a link, a file (PDF, photo, Word, text) or pasted text goes to the importRecipe function, which returns drafts to review.
function importPanel() {
  const m = state.importMode || "url";

    text: `${state.blockedUrl ? `<p class="hint"><a href="${esc(state.blockedUrl)}" target="_blank" rel="noopener">Open the recipe page</a>, press Cmd+A then Cmd+C, and paste it below. Ads and comments are fine; only the recipe is kept.</p>` : ""}<div class="field"><label for="imp-paste">Paste a recipe</label><textarea class="code" id="imp-paste" style="font-family:var(--font-body);font-size:14px" placeholder="Paste the recipe text, including ingredients and steps"></textarea></div>`,

      <label class="checks"><label><input type="checkbox" id="imp-totals"> Macros are for the whole recipe, not per serving</label></label>

  }[m];
  return `<section class="panel">
    <div class="row"><h2>Import recipes</h2><span class="spacer"></span><button class="btn ghost small" data-action="cancel-import">Close</button></div>
    <div class="seg" role="group" aria-label="Import from">${tab("url", "Link")}${tab("file", "PDF, photo or document")}${tab("text", "Paste text")}${tab("backup", "Backup file")}</div>
    <div class="form">${body}
      <div class="row"><button class="btn primary" data-action="do-import" ${state.importBusy ? "disabled" : ""}>${state.importBusy ? "Reading the recipe…" : "Import"}</button><button class="btn ghost" data-action="manual-entry">Enter a recipe by hand</button></div>
      <div id="imp-result">${state.importError ? `<div class="notice">${esc(state.importError)} <button class="btn small" data-action="manual-entry">Enter it by hand</button></div>` : ""}</div>
    </div></section>`;
}
function fileToBase64(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
}
// Photos are shrunk to 2000 px on the long side; recipe text stays readable and uploads stay small.
function shrinkImage(file) {
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function runImport() {
  const m = state.importMode || "url";
  let payload = null;
  if (m === "url") { const u = document.getElementById("imp-url").value.trim(); if (!u) return; payload = { url: u }; }
  if (m === "text") { const t = document.getElementById("imp-paste").value.trim(); if (!t) return; payload = { text: t }; }
  if (m === "file") {
    const f = document.getElementById("imp-file").files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024 && !/^image\//.test(f.type)) { state.importError = "That file is over 8 MB. Try a smaller PDF or a photo."; return render(); }
    const data = /^image\//.test(f.type) ? await shrinkImage(f) : await fileToBase64(f);
    if (!data) { state.importError = "That image couldn't be opened. Try a JPEG or PNG."; return render(); }
    payload = { file: { data, mime: /^image\//.test(f.type) ? "image/jpeg" : f.type, name: f.name } };
  }
  if (m === "backup") {
    const f = document.getElementById("imp-backup").files[0]; if (!f) return;
    const text = await f.text();
    let res;
    try { res = parseImport(text, { totals: document.getElementById("imp-totals").checked }); }
    catch (err) { state.importError = `That file didn't parse. Check that it's valid JSON or a CSV with a header row. (${err.message})`; return render(); }
    try { const data = JSON.parse(text); if (data && data.settings && typeof data.settings === "object") { state.settings = mergeSettings({ ...data.settings, onboarded: true }); saveSettings(); } } catch {}
    if (res.ok.length) await saveRecipes(res.ok);
    state.importError = res.bad.length ? `Imported ${res.ok.length}. Skipped ${res.bad.length}: ${res.bad.join("; ")}` : "";
    state.importing = !!res.bad.length; render();
    return toast(`Imported ${res.ok.length} recipe${res.ok.length === 1 ? "" : "s"}.`);
  }
  if (!window.firebase || !auth) { state.importError = "Import needs the online app. Sign in and try again."; return render(); }
  state.importBusy = true; state.importError = ""; render();
  try {
    payload.known = knownIngredients().slice(0, 600);
    const call = firebase.functions().httpsCallable("importRecipe", { timeout: 300000 });
    const { data } = await call(payload);
    const drafts = (data.recipes || []).map(x => { try { return normalizeRecipe({ ...x, estimated: x.macrosEstimated }); } catch { return null; } }).filter(Boolean);
    if (!drafts.length) throw new Error("No recipe was found in that. Try another file, or enter it by hand.");
    state.drafts = drafts; state.draftTotal = drafts.length; state.editing = "draft";
  } catch (e) {
    state.importError = (e && e.message && !/^internal$/i.test(e.message)) ? e.message : "The import didn't work. Try again, or enter the recipe by hand.";
    // Sites that refuse automatic import: switch to pasting the page, with a link to open it.
    if (e && e.details && e.details.blocked) { state.importMode = "text"; state.blockedUrl = e.details.url || payload.url; }
  }
  state.importBusy = false; render(); window.scrollTo({ top: 0 });
}

// Recipe detail sheet. With a portion (opened from the plan) amounts are scaled to that portion.
let viewing = null, lastFocus = null;
function openRecipe(id, x, from) {

function renderSheet() {

  el.innerHTML = `<div class="sheet-back" data-action="close-sheet">

        <button class="close" id="sheet-close" data-action="close-sheet" aria-label="Close recipe">×</button>
      </div>
      ${macroSummary(r, 1, null, r.estimated ? "Per serving · estimated, not from the source" : "Per serving")}
      ${x && x !== 1 ? `<div><h3><span>Your portion: ${x} servings</span></h3><div class="mfacts">${facts}</div></div>` : ""}
      ${mfpBlock(r, x)}

      <div><h3><span>Instructions</span></h3>${steps}</div>

    </div></div>`;

/* ---------- MyFitnessPal ---------- */
// MyFitnessPal's Quick Add asks for calories, carbs, fat and protein, in that order.
function mfpNumbers(r, x) {
  const m = x || 1;
  return { cal: Math.round(r.cal * m), c: Math.round(r.c * m), f: Math.round(r.f * m), p: Math.round(r.p * m) };
}
function mfpLine(r, x, label) {
  const n = mfpNumbers(r, x);
  return `${label ? label + ": " : ""}${r.name}${x && x !== 1 ? ` (×${x})` : ""}\n  Calories ${n.cal} · Carbs ${n.c} g · Fat ${n.f} g · Protein ${n.p} g`;
}
// Only Coach Greg recipes have a barcode MyFitnessPal recognises (the one printed in their pack, r.mfp).
// Every other recipe exists in MyFitnessPal as a public food named "<brand> <name>", found by search.
function mfpBrand(r) {
  const pre = String(r.id).split("-")[0];
  return pre === "st" ? "Strong" : pre === "hp" ? "Coach Greg" : pre === "my" ? "Homemade" : pre === "hf" ? "HelloFresh" : pre === "gc" ? "Green Chef" : pre === "ba" ? "Blue Apron" : "";
}
function mfpBlock(r, x) {
  const n = mfpNumbers(r, x);
  const portion = x && x !== 1 ? `, then set servings to ${x}` : "";
  const brand = mfpBrand(r);
  const scan = r.mfp && r.mfp.code
    ? `<div class="barcode"><svg id="mfp-barcode" role="img" aria-label="MyFitnessPal barcode ${esc(r.mfp.code)}"></svg><span>Scan in MyFitnessPal${portion}</span></div>`
    : "";
  const search = !scan && brand
    ? `<p class="first-scan">In the MyFitnessPal app, search <b>${esc(brand + " " + r.name)}</b> and add it${portion}.</p>`
    : "";
  return `<div><h3><span>Log in MyFitnessPal</span></h3>
    <div class="mfp-row">${scan}
      <div class="quick">
        <p>${scan || search ? "Or use Quick Add" : "Use Quick Add"} with these numbers ${x ? "for this portion" : "per serving"}:</p>
        <dl><dt>Calories</dt><dd>${n.cal}</dd><dt>Carbs</dt><dd>${n.c} g</dd><dt>Fat</dt><dd>${n.f} g</dd><dt>Protein</dt><dd>${n.p} g</dd></dl>
        <div class="row"><button class="btn small" data-action="copy-mfp" data-id="${esc(r.id)}" data-x="${x || ""}">Copy for Quick Add</button></div>
      </div>
    </div>${search}</div>`;
}
function drawBarcode(r) {
  const el = document.getElementById("mfp-barcode");
  if (!el || !r.mfp) return;
  try {
    window.JsBarcode(el, r.mfp.code, { format: r.mfp.format === "UPCE" ? "UPCE" : "UPC", background: "#ffffff", lineColor: "#000000", width: 2, height: 64, margin: 8, fontSize: 14 });
  } catch { el.closest(".barcode").innerHTML = `<span>Barcode ${esc(r.mfp.code)}: type it into MyFitnessPal's barcode search</span>`; }
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch { toast("Copying isn't allowed here. The numbers are shown on the recipe instead."); }
}
function mfpDayText(d) {
  const day = state.plan.days[d], lines = [];
  for (const s of activeSlots()) {
    const c = day.slots[s], r = c && state.recipes[c.id];
    if (r) lines.push(mfpLine(r, c.x || 1, SLOTS.find(x => x[0] === s)[1]));
  }
  const st = dayStatus(d);
  lines.push(`Total: Calories ${Math.round(st.tot.cal)} · Carbs ${Math.round(st.tot.c)} g · Fat ${Math.round(st.tot.f)} g · Protein ${Math.round(st.tot.p)} g`);
  return `${DAYS[d]} for MyFitnessPal Quick Add\n` + lines.join("\n");
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pendingDelete) closeDialog(); else if (viewing) closeRecipe();
});

// Deleting a recipe takes two steps: the Delete button opens this dialog, and only its Delete recipe button deletes.

}

  return `<div class="grid2">

        ${MACROS.map(([k, l, u]) => `<div class="field"><label for="t-${k}">${l} (${u})</label><input id="t-${k}" type="number" min="0" data-target="${k}" value="${t[k]}" ${dis}></div>`).join("")}
      </div>
      <p class="hint">Your macros add up to <b class="num">${fromMacros.toLocaleString()} kcal</b> (4 per gram of protein and carbs, 9 per gram of fat)${Math.abs(diff) > 40 ? `, ${Math.abs(diff)} ${diff > 0 ? "more" : "less"} than your calorie target. Plans will struggle to hit both. <button class="btn small" data-action="sync-cal" ${dis}>Use ${fromMacros}</button>` : "."}</p>
      <h2>How close is close enough</h2>
      <div class="fgrid">
        ${MACROS.map(([k, l]) => `<div class="field"><label for="tol-${k}">${l} ± %</label><input id="tol-${k}" type="number" min="1" max="50" data-tol="${k}" value="${S.tol[k]}" ${dis}></div>`).join("")}
      </div>
      <p class="hint">A day counts as on target when every number is inside its band. Tighter bands mean fewer possible plans.</p>
      </fieldset>
    </section>
    <section class="panel form">
      <h2>Household</h2>
      <div class="field" style="max-width:220px"><label for="household">People you cook for</label><input id="household" type="number" min="1" max="12" step="1" data-setting="household" value="${household()}"></div>
      <p class="hint">Recipe amounts and the grocery list scale to this. Macros stay per person.</p>
      <h2>Meals and portions</h2>
      <div class="field"><span class="label">Meals each day</span><div class="checks">${SLOTS.map(([k, l]) => `<label><input type="checkbox" id="ms-${k}" data-mslot="${k}" ${S.slots[k] ? "checked" : ""} ${dis}> ${l}</label>`).join("")}</div></div>
      <div class="fgrid">
        <div class="field"><label for="pmin">Smallest portion (servings)</label><input id="pmin" type="number" min="0.25" max="3" step="0.25" data-setting="portionMin" value="${S.portionMin}" ${dis}></div>
        <div class="field"><label for="pmax">Largest portion (servings)</label><input id="pmax" type="number" min="0.5" max="4" step="0.25" data-setting="portionMax" value="${S.portionMax}" ${dis}></div>
        <div class="field"><label for="maxrep">Max days per snack</label><input id="maxrep" type="number" min="1" max="7" step="1" data-setting="maxRepeat" value="${S.maxRepeat}" ${dis}></div>
      </div>
      <p class="hint">Portions only change when targets are on. Cooked meals never repeat in a week; snacks can, up to this many days.</p>
      <h2>Cook once, eat twice</h2>
      <div class="checks" style="flex-direction:column;align-items:flex-start;gap:8px">
        <label><input type="checkbox" data-flag="leftovers" ${S.leftovers ? "checked" : ""} ${dis}> Each dinner is next day's lunch (Sunday's dinner is Monday's lunch)</label>
        <label><input type="checkbox" data-flag="bfRotation" ${S.bfRotation ? "checked" : ""} ${dis}> Three breakfasts a week: Mon–Tue, Wed–Thu, Fri–Sun (Fri–Sun car-friendly)</label>
      </div>
      <p class="hint">Mark a recipe "Car-friendly" in its editor to make it eligible for Friday–Sunday breakfasts. Portions can still differ between the two meals so each day stays on target.</p>
    </section></div>
    <div class="grid2" style="margin-top:16px">${PRIVACY}
      <section class="panel"><h2>Account</h2><p class="hint">Signed in as ${esc(state.user ? state.user.email : "a local test user")}. Your library: ${Object.keys(state.recipes).length} recipes.</p>
        <div class="row"><button class="btn" data-action="export-backup">Download a backup</button>${state.user ? `<button class="btn ghost" data-action="sign-out">Sign out</button>` : ""}</div></section></div>`;
}

/* ---------- events ---------- */
function setTab(t) {
  state.tab = t; lsSet("mpp.tab", t);
  try { history.replaceState(null, "", "#" + t); } catch {}
  render();
}
function allDays() { return DAYS.map((_, i) => i); }
function afterGenerate(res, what) {
  savePlan(); render();
  const label = { breakfast: "breakfast", lunch: "lunch", dinner: "dinner" };
  const short = Object.entries(res.shortBy || {}).map(([s, n]) => `${n} more ${label[s]} recipe${n > 1 ? "s" : ""}`);
  if (res.skipped.length) toast(`No recipes fit ${res.skipped.map(d => DAYS[d]).join(", ")}. Add recipes for every meal or widen the cuisine filter.`);
  else if (res.repeats && res.repeats.length) toast(`A meal had to repeat because there aren't enough recipes${short.length ? `: add ${short.join(" and ")}` : ""}, or widen the cuisine filter.`);
  else if (res.offTarget.length) toast(`Couldn't hit every target: ${res.offTarget.map(d => `${DAYS[d]} ${dayMiss(d) ? dayMiss(d).text : ""}`).join("; ")}.`);
  else if (res.cuisineMiss) toast(`${what} Only one cuisine fit your filters this week.`);
  else toast(what);
}
function exportBackup() {
  const data = { app: "macro-prep-planner", exported: new Date().toISOString(), settings: state.settings, recipes: Object.values(state.recipes).map(stripRecipe) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = "meal-planner-backup.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function busy(fn) {
  document.body.style.cursor = "progress";
  setTimeout(() => { try { fn(); } finally { document.body.style.cursor = ""; } }, 10);
}

document.addEventListener("click", async e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) return setTab(tabBtn.dataset.tab);
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const a = b.dataset.action, d = +b.dataset.d, S = state.settings;
  if (a === "close-sheet") { if (e.target === b || b.id === "sheet-close") closeRecipe(); return; }
  if (a === "cancel-del") { if (e.target === b || b.tagName === "BUTTON") closeDialog(); return; }
  if (a === "view") return openRecipe(b.dataset.id, b.dataset.x, b);
  if (a === "copy-mfp") { const r = state.recipes[b.dataset.id]; if (r) copyText(mfpLine(r, b.dataset.x ? +b.dataset.x : null), "Copied. Paste into MyFitnessPal Quick Add."); return; }
  if (a === "copy-mfp-day") return copyText(mfpDayText(d), `Copied ${DAYS[d]}'s meals for MyFitnessPal.`);
  switch (a) {
    case "sign-in": return signIn();
    case "sign-out": return signOut();
    case "finish-onboarding": {
      const h = Math.round(+document.getElementById("ob-household").value);
      if (!(h >= 1)) { toast("Enter how many people you cook for."); return; }
      S.household = h;
      S.useTargets = document.getElementById("ob-targets").checked;
      if (S.useTargets) for (const [k] of MACROS) { const v = parseFloat(document.getElementById("ob-" + k).value); if (v >= 0) S.targets[k] = v; }
      S.onboarded = true; saveSettings();
      state.tab = "recipes"; state.importing = true; return render();
    }
    case "goto-import": state.editing = null; state.importing = true; return setTab("recipes");
    case "goto-new": state.importing = false; state.editing = "new"; return setTab("recipes");
    case "have": case "unhave": {
      const k = b.dataset.key, set = new Set(S.have || []);
      if (a === "have") set.add(k); else set.delete(k);
      S.have = [...set]; saveSettings();
      toast(a === "have" ? "Hidden from your lists. Find it under Items you already have." : "Added back to your list.");
      return render();
    }
    case "imp-mode": state.importMode = b.dataset.m; state.importError = ""; state.blockedUrl = ""; return render();
    case "do-import": return runImport();
    case "manual-entry": state.importError = ""; state.importing = false; state.editing = "new"; render(); document.getElementById("f-name")?.focus(); return;
    case "add-ing": {
      const body = document.getElementById("ing-body");
      body.insertAdjacentHTML("beforeend", ingRow({ item: "" }, body.querySelectorAll("[data-ing-row]").length + 1));
      body.querySelector("[data-ing-row]:last-of-type [data-f=item]")?.focus();
      return;
    }
    case "rm-ing": {
      const tr = b.closest("tr"), next = tr.nextElementSibling;
      if (next && next.hasAttribute("data-orig")) next.remove();
      tr.remove(); return;
    }
    case "skip-draft": state.drafts.shift(); if (!state.drafts.length) state.editing = null; render(); window.scrollTo({ top: 0 }); return;
    case "export-backup": return exportBackup();
    case "edit-from-sheet": viewing = null; renderSheet(); state.editing = b.dataset.id; state.importing = false; state.tab = "recipes"; render(); window.scrollTo({ top: 0 }); return;
    case "goto": state.editing = null; return setTab(b.dataset.tab);
    case "cuisine-all": S.cuisines = []; saveSettings(); return render();
    case "cuisine": {
      const c = b.dataset.c;
      S.cuisines = S.cuisines.includes(c) ? S.cuisines.filter(x => x !== c) : [...S.cuisines, c];
      saveSettings(); return render();
    }
    case "gen-lean": return busy(() => {
      const res = generate("lean", allDays());
      afterGenerate(res, `Planned a varied week with ${weekSummary().unique} unique ingredients.`);
    });
    case "gen-random": return busy(() => afterGenerate(generate("random", allDays()), "Here's a random week that still follows your rules."));
    case "fill-empty": return busy(() => {
      const days = allDays().filter(i => !dayStatus(i).complete);
      if (!days.length) return toast("Every day is already filled.");
      afterGenerate(generate("lean", days), `Filled ${days.length} day${days.length > 1 ? "s" : ""}.`);
    });
    case "fill-day": case "fix-day": return busy(() => afterGenerate(generate("lean", [d]), `${DAYS[d]} is balanced.`));
    case "reroll-day": return busy(() => afterGenerate(generate("random", [d]), `New meals for ${DAYS[d]}.`));
    case "clear-unlocked":
      state.plan.days.forEach(day => { for (const s in day.slots) if (!day.slots[s] || !day.slots[s].locked) delete day.slots[s]; });
      savePlan(); return render();
    case "clear-all":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to clear"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Clear all"; } }, 3000); return; }
      state.plan = { ...emptyPlan(), checked: {} }; savePlan(); return render();
    case "lock": {
      const c = state.plan.days[d].slots[b.dataset.s]; if (!c) return;
      const to = !c.locked;
      for (const [ld, ls] of linkedSlots(d, b.dataset.s)) { const o = state.plan.days[ld].slots[ls]; if (o && o.id === c.id) o.locked = to; }
      savePlan(); return render();
    }
    case "copy-list": {
      const { items } = groceries();
      const txt = CATS.map(cat => {
        const l = items.filter(i => (CATS.includes(i.category) ? i.category : "Other") === cat).sort((x, y) => x.name.localeCompare(y.name));
        return l.length ? cat + "\n" + l.map(g => `- ${g.name}: ${amountText(g)}`).join("\n") : "";
      }).filter(Boolean).join("\n\n");
      try { await navigator.clipboard.writeText(txt); toast("Grocery list copied."); }
      catch { const ta = document.createElement("textarea"); ta.value = txt; ta.className = "code"; b.closest(".panel").prepend(ta); ta.select(); toast("Select-all is ready. Copy with your keyboard."); }
      return;
    }
    case "uncheck": state.plan.checked = {}; savePlan(); return render();
    case "remove-examples": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to remove"; return; }
      const ids = Object.values(state.recipes).filter(r => r.example).map(r => r.id);
      await deleteRecipes(ids); toast(`Removed ${ids.length} examples.`); return render();
    }
    case "new": state.editing = "new"; state.importing = false; render(); document.getElementById("f-name")?.focus(); return;
    case "edit": state.editing = b.dataset.id; state.importing = false; render(); window.scrollTo({ top: 0 }); return;
    case "cancel-edit": state.editing = null; state.drafts = []; return render();
    case "del": return askDelete(b.dataset.id, b);
    case "confirm-del": {
      const id = b.dataset.id, name = state.recipes[id]?.name;
      pendingDelete = null; renderDialog();
      let removed = 0;
      state.plan.days.forEach(day => { for (const s in day.slots) if (day.slots[s] && day.slots[s].id === id) { delete day.slots[s]; removed++; } });
      if (removed) savePlan();
      await deleteRecipes([id]);
      toast(`Deleted ${name}.${removed ? ` Cleared it from ${removed} meal${removed > 1 ? "s" : ""} in your plan.` : ""}`);
      return render();
    }
    case "import": state.importing = true; state.editing = null; state.importError = ""; render(); window.scrollTo({ top: 0 }); return;
    case "cancel-import": state.importing = false; state.importError = ""; return render();
    case "sync-cal": S.targets.cal = Math.round(S.targets.p * 4 + S.targets.c * 4 + S.targets.f * 9); saveSettings(); return render();
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (state.readOnly) return;
  if (t.matches("select[data-s]")) {
    const d = +t.dataset.d, s = t.dataset.s, day = state.plan.days[d];
    const linked = linkedSlots(d, s);
    for (const [ld, ls] of linked) {
      if (t.value) state.plan.days[ld].slots[ls] = { id: t.value, x: 1, locked: true }; else delete state.plan.days[ld].slots[ls];
    }
    new Set(linked.map(([ld]) => ld)).forEach(ld => rebalance(ld));
    savePlan(); return render();
  }
  if (t.matches("select[data-daycuisine]")) {
    state.plan.days[+t.dataset.daycuisine].cuisine = t.value; savePlan();
    const d = +t.dataset.daycuisine;
    if (t.value) return busy(() => afterGenerate(generate("lean", [d]), `${DAYS[d]} is now a ${t.value} day.`));
    return render();
  }
  if (t.matches("input[data-gkey]")) {
    state.plan.checked = state.plan.checked || {};
    if (t.checked) state.plan.checked[t.dataset.gkey] = true; else delete state.plan.checked[t.dataset.gkey];
    t.closest(".gitem").classList.toggle("done", t.checked);
    return savePlan();
  }
  const S = state.settings;
  if (t.matches("[data-target]")) { const v = parseFloat(t.value); if (v >= 0) { S.targets[t.dataset.target] = v; saveSettings(); render(); } return; }
  if (t.matches("[data-tol]")) { const v = parseFloat(t.value); if (v > 0) { S.tol[t.dataset.tol] = v; saveSettings(); render(); } return; }
  if (t.matches("[data-flag]")) { S[t.dataset.flag] = t.checked; saveSettings(); state.plan.days.forEach((_, d) => rebalance(d)); savePlan(); return render(); }
  if (t.id === "ob-targets") { document.getElementById("ob-tfields").hidden = !t.checked; return; }
  // Naming an ingredient picks its store section, unless the section was chosen by hand.
  if (t.matches("#ing-body [data-f=item]")) {
    const sel = t.closest("tr").querySelector("[data-f=category]");
    if (!sel.dataset.touched) { const known = Object.values(state.recipes).flatMap(r => r.ingredients).find(i => i.item === t.value.trim().toLowerCase()); sel.value = known ? known.category : guessCategory(t.value); }
    return;
  }
  if (t.matches("#ing-body [data-f=category]")) { t.dataset.touched = "1"; return; }
  if (t.matches("[data-cooked]")) {
    state.plan.cooked = state.plan.cooked || {};
    if (t.checked) state.plan.cooked[t.dataset.cooked] = { at: new Date().toISOString() }; else delete state.plan.cooked[t.dataset.cooked];
    savePlan(); return render();
  }
  if (t.matches("[data-rating]")) {
    const c = (state.plan.cooked || {})[t.dataset.rating]; if (c) { c.rating = t.value ? +t.value : null; savePlan(); }
    return;
  }
  if (t.matches("[data-mslot]")) { S.slots[t.dataset.mslot] = t.checked; saveSettings(); state.plan.days.forEach((_, d) => rebalance(d)); savePlan(); return render(); }
  if (t.matches("[data-setting]")) {
    const v = parseFloat(t.value); if (!(v > 0)) return;
    S[t.dataset.setting] = t.dataset.setting === "household" ? Math.round(v) : v;
    if (S.portionMin > S.portionMax) S.portionMax = S.portionMin;
    saveSettings(); return render();
  }
  if (t.id === "rcuisine") { state.rcuisine = t.value; return render(); }
  if (t.id === "rsort") { state.rsort = t.value; lsSet("mpp.rsort", t.value); return render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "rsearch") {
    state.rsearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("rsearch"); el.focus(); el.setSelectionRange(pos, pos);
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "recipe-form") return;
  e.preventDefault();
  const val = id => document.getElementById(id).value;
  const meals = SLOTS.map(s => s[0]).filter(k => document.getElementById("f-meal-" + k).checked);
  const isDraft = state.editing === "draft", draft = isDraft ? state.drafts[0] : null;
  const existing = !isDraft && state.editing !== "new" ? state.recipes[state.editing] : null;
  const ingredients = [...document.querySelectorAll("#ing-body [data-ing-row]")].map(tr => {
    const f = k => tr.querySelector(`[data-f=${k}]`).value.trim();
    const item = f("item").toLowerCase();
    if (!item) return null;
    const qty = f("qty") === "" ? null : parseFloat(f("qty"));
    const orig = tr.nextElementSibling && tr.nextElementSibling.hasAttribute("data-orig") ? tr.nextElementSibling.textContent.replace(/^From the source:\s*/, "") : "";
    return { item, qty: isNaN(qty) ? null : qty, unit: f("unit").toLowerCase(), prep: f("prep"), category: f("category"), ...(orig ? { line: orig } : {}) };
  }).filter(Boolean);
  if (!ingredients.length) { toast("Add at least one ingredient."); return; }
  try {
    const r = normalizeRecipe({
      id: existing ? existing.id : undefined,
      name: val("f-name"), cuisine: val("f-cuisine") || "Other", meals: meals.length ? meals : ["lunch","dinner"],
      servings: val("f-serv"), calories: val("f-cal"), protein: val("f-p"), carbs: val("f-c"), fat: val("f-f"),
      ingredients, steps: val("f-steps").split("\n").filter(l => l.trim()),
      estimated: document.getElementById("f-est").checked,
      example: existing ? existing.example : false,
      source: existing ? existing.source : isDraft ? "Imported" : undefined,
      mfp: existing ? existing.mfp : undefined,
      portable: document.getElementById("f-portable").checked
    });
    await saveRecipes([r]);
    if (isDraft) {
      state.drafts.shift();
      if (state.drafts.length) { toast(`Saved ${r.name}. Next one to review.`); render(); window.scrollTo({ top: 0 }); return; }
      state.importing = true;
    }
    state.editing = null;
    const n = Object.keys(state.recipes).length;
    toast(`Saved ${r.name}.${n < MIN_RECIPES ? ` ${MIN_RECIPES - n} more to unlock your first plan.` : n === MIN_RECIPES ? " Plan generation is unlocked." : ""}`);
    render();
  } catch (err) { toast(`Can't save: the recipe is ${err.message}.`); }
});

/* ---------- start ---------- */
(function init() {
  const h = (location.hash || "").slice(1);
  state.tab = ["plan","groceries","recipes","targets"].includes(h) ? h : (lsGet("mpp.tab") || "plan");
  boot();
})();
</script>
</body>
